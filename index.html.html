<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>PackCheck — ระบบเช็คแพ็คสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0e1318;
    --surface:#171f26;
    --surface2:#1f2a33;
    --border:#2b3944;
    --accent:#ffb020;
    --accent-2:#ff7a1a;
    --success:#2fbf71;
    --success-dim:#173325;
    --danger:#ff4d4f;
    --danger-dim:#331a1b;
    --warn:#ffb020;
    --warn-dim:#332810;
    --text:#eef2f6;
    --muted:#8ea0ac;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Oswald',sans-serif;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}

  /* ---- barcode stripe header ---- */
  .stripes{
    height:10px;width:100%;
    background:repeating-linear-gradient(90deg,var(--accent) 0 3px, transparent 3px 6px, var(--accent-2) 6px 8px, transparent 8px 13px, var(--accent) 13px 16px, transparent 16px 22px);
    opacity:.9;
  }
  header.top{
    padding:18px 18px 14px;
    background:linear-gradient(180deg,var(--surface),var(--bg));
    border-bottom:1px solid var(--border);
  }
  header.top .brand{
    font-family:var(--disp);
    font-weight:700;
    font-size:22px;
    letter-spacing:.5px;
    text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  header.top .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  header.top .sub{color:var(--muted);font-size:13px;margin-top:2px;}

  nav.tabs{
    display:flex;gap:0;background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  nav.tabs button{
    flex:1;padding:13px 8px;background:none;border:none;color:var(--muted);
    font-family:var(--disp);font-size:14px;letter-spacing:.4px;text-transform:uppercase;font-weight:600;
    border-bottom:3px solid transparent;cursor:pointer;
  }
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{flex:1;padding:16px;padding-bottom:90px;}

  /* generic */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--disp);font-weight:600;letter-spacing:.3px;text-transform:uppercase;font-size:14px;
    padding:13px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;
    background:var(--accent);color:#1a1305;width:100%;
  }
  .btn.secondary{background:var(--surface2);color:var(--text);border-color:var(--border);}
  .btn.danger{background:var(--danger);color:#2b0505;}
  .btn.ghost{background:none;color:var(--accent);border-color:var(--border);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  input[type=text],input[type=date],input[type=number],select{
    width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:11px 12px;border-radius:8px;font-size:15px;font-family:var(--body);margin-bottom:12px;
  }
  select{appearance:none;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  h2.section{font-family:var(--disp);font-size:17px;letter-spacing:.3px;text-transform:uppercase;margin:4px 0 12px;color:var(--text);}
  .muted{color:var(--muted);}
  .mono{font-family:var(--mono);}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--disp);letter-spacing:.3px;text-transform:uppercase;}
  .pill.pending{background:var(--surface2);color:var(--muted);}
  .pill.progress{background:var(--warn-dim);color:var(--warn);}
  .pill.done{background:var(--success-dim);color:var(--success);}
  .empty{text-align:center;padding:40px 16px;color:var(--muted);}
  .empty .big{font-size:40px;margin-bottom:8px;}

  /* order list */
  .order-item{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-left:4px solid var(--muted);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
  }
  .order-item.pending{border-left-color:var(--muted);}
  .order-item.progress{border-left-color:var(--warn);}
  .order-item.done{border-left-color:var(--success);}
  .order-item .oid{font-family:var(--mono);font-weight:700;font-size:14px;}
  .order-item .meta{flex:1;min-width:0;}
  .order-item .cust{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .order-item .progtext{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap;}

  .stats-row{display:flex;gap:10px;margin-bottom:14px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;}
  .stat .num{font-family:var(--disp);font-size:22px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}

  /* order detail */
  .detail-header{margin-bottom:14px;}
  .back{background:none;border:none;color:var(--accent);font-family:var(--disp);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0 14px;text-transform:uppercase;}
  .item-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
  .item-row.done{border-color:var(--success);background:var(--success-dim);}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .item-row.done .check{background:var(--success);border-color:var(--success);color:#06210f;}
  .item-info{flex:1;min-width:0;}
  .item-info .name{font-size:14px;font-weight:600;line-height:1.3;}
  .item-info .code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;}
  .item-qty{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap;}
  .item-qty.over{color:var(--warn);}
  .adjust{display:flex;gap:4px;margin-left:6px;}
  .adjust button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;line-height:1;cursor:pointer;}

  .feedback{
    position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    font-family:var(--disp);font-weight:700;font-size:16px;text-align:center;
    transform:translateY(110%);transition:transform .18s ease-out;z-index:50;
  }
  .feedback.show{transform:translateY(0);}
  .feedback.success{background:var(--success);color:#06210f;}
  .feedback.danger{background:var(--danger);color:#2b0505;}
  .feedback.warn{background:var(--warn);color:#2b1f04;}

  .scan-bar{
    position:sticky;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));margin:0 -16px -90px;
  }
  .scan-input-row{display:flex;gap:8px;margin-bottom:8px;}
  .scan-input-row input{margin-bottom:0;font-family:var(--mono);}

  #cam-wrap{display:none;margin-bottom:10px;border-radius:10px;overflow:hidden;border:2px solid var(--accent);position:relative;}
  #cam-wrap.active{display:block;}
  #reader{width:100%;}
  .scan-line{position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:scanmove 1.6s linear infinite;pointer-events:none;}
  @keyframes scanmove{0%{top:6%;}50%{top:94%;}100%{top:6%;}}

  .banner-done{
    background:var(--success-dim);border:1px solid var(--success);border-radius:12px;padding:18px;text-align:center;margin-bottom:14px;
  }
  .banner-done .big{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--success);text-transform:uppercase;}
  .banner-done .time{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono);}

  /* upload mapping */
  .map-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .preview-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  .preview-table th,.preview-table td{border:1px solid var(--border);padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
  .preview-table th{background:var(--surface2);color:var(--muted);font-weight:600;}
  .preview-wrap{overflow-x:auto;}
  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:100;box-shadow:0 6px 18px rgba(0,0,0,.4);max-width:90%;
  }
  .file-drop{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted);margin-bottom:14px;cursor:pointer;}
  .file-drop:hover{border-color:var(--accent);color:var(--text);}
  .switch-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;}
  .switch-row select{margin-bottom:0;width:auto;}
</style>
</head>
<body>
<div id="app">
  <div class="stripes"></div>
  <header class="top">
    <div class="brand"><span class="dot"></span>PackCheck</div>
    <div class="sub">เช็คสแกนสินค้าก่อนแพ็คส่ง — กันของผิด กันแพ็คตก</div>
  </header>
  <nav class="tabs">
    <button id="tab-staff" class="active">สแกนแพ็ค</button>
    <button id="tab-admin">อัปโหลดออเดอร์</button>
  </nav>
  <main id="main"></main>
  <div id="feedback" class="feedback"></div>
</div>

<script>
/* ============ STORAGE HELPERS ============ */
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ return await window.storage.set(key, value, shared); }
  catch(e){ console.error('storage set failed', key, e); return null; }
}
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }
async function sSetWithRetry(key, value, shared, maxRetries){
  maxRetries = maxRetries || 6;
  let attempt = 0;
  while(attempt <= maxRetries){
    try{
      const r = await window.storage.set(key, value, shared);
      if(r) return r;
      throw new Error('empty result');
    }catch(e){
      attempt++;
      if(attempt > maxRetries){ console.error('storage set gave up', key, e); return null; }
      const wait = 400 * attempt; // backoff
      await sleep(wait);
    }
  }
}
async function sList(prefix, shared){
  try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
  catch(e){ return []; }
}

/* ============ UTIL ============ */
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function fmtDateTH(dstr){
  const [y,m,d] = dstr.split('-');
  return d+'/'+m+'/'+y;
}
function nowTime(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes());
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

/* beep via WebAudio, no external asset */
function beep(type){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    let freq = 880, dur = 0.12;
    if(type==='error'){ freq=180; dur=0.28; }
    if(type==='warn'){ freq=420; dur=0.16; }
    if(type==='done'){ freq=1200; dur=0.35; }
    o.frequency.value = freq;
    o.type = type==='error' ? 'sawtooth' : 'sine';
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur+0.02);
    setTimeout(()=>ctx.close(), (dur+0.1)*1000);
  }catch(e){}
}

function showFeedback(kind, text){
  const f = document.getElementById('feedback');
  f.className = 'feedback show ' + kind;
  f.textContent = text;
  clearTimeout(showFeedback._t);
  showFeedback._t = setTimeout(()=>{ f.className='feedback '+kind; }, 1400);
}

/* ============ STATE ============ */
const State = {
  view: 'staff', // staff | admin
  staffSub: 'list', // list | detail
  date: todayStr(),
  dates: [],
  orders: [], // cached list for current date
  currentOrderId: null,
  currentOrder: null,
  search: '',
  html5Qr: null,
  camActive: false,
  uploadParsed: null // {headers, rows}
};

/* ============ DATA LAYER ============ */
async function loadDateIndex(){
  const raw = await sGet('dateindex', true);
  let arr = [];
  try{ arr = raw ? JSON.parse(raw) : []; }catch(e){ arr=[]; }
  if(!arr.includes(todayStr())){ /* don't force-add; only real uploaded dates matter */ }
  arr.sort().reverse();
  State.dates = arr;
  return arr;
}
async function addDateToIndex(date){
  const raw = await sGet('dateindex', true);
  let arr = [];
  try{ arr = raw ? JSON.parse(raw) : []; }catch(e){ arr=[]; }
  if(!arr.includes(date)){ arr.push(date); await sSet('dateindex', JSON.stringify(arr), true); }
}

async function sGetWithRetry(key, shared, maxRetries){
  maxRetries = maxRetries || 4;
  let attempt = 0;
  while(attempt <= maxRetries){
    try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
    catch(e){
      attempt++;
      if(attempt > maxRetries) return null;
      await sleep(300 * attempt);
    }
  }
}
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let i = 0;
  async function worker(){
    while(i < items.length){
      const idx = i++;
      results[idx] = await fn(items[idx], idx);
    }
  }
  const workers = Array.from({length: Math.min(limit, items.length)}, worker);
  await Promise.all(workers);
  return results;
}

async function loadOrdersForDate(date){
  const keys = await sList('order:'+date+':', true);
  const results = await mapWithConcurrency(keys, 6, async k => {
    const v = await sGetWithRetry(k, true);
    if(!v) return null;
    try{ return JSON.parse(v); }catch(e){ return null; }
  });
  const orders = results.filter(Boolean);
  orders.sort((a,b) => {
    const sa = orderStatus(a), sb = orderStatus(b);
    const rank = {pending:0, progress:1, done:2};
    if(rank[sa]!==rank[sb]) return rank[sa]-rank[sb];
    return a.orderId.localeCompare(b.orderId);
  });
  return orders;
}
function sanitizeKeyPart(s){
  return String(s==null?'':s).trim().replace(/[\s\/\\'"]+/g, '_').slice(0, 120);
}
function orderKey(date, orderId){ return 'order:'+date+':'+sanitizeKeyPart(orderId); }

function orderStatus(order){
  let total=0, scanned=0;
  order.items.forEach(it => { total += it.qtyRequired; scanned += Math.min(it.qtyScanned, it.qtyRequired); });
  if(scanned===0) return 'pending';
  if(scanned>=total) return 'done';
  return 'progress';
}
function orderProgress(order){
  let total=0, scanned=0;
  order.items.forEach(it => { total += it.qtyRequired; scanned += Math.min(it.qtyScanned, it.qtyRequired); });
  return {scanned, total};
}

async function saveOrder(date, order){
  order.updatedAt = Date.now();
  await sSet(orderKey(date, order.orderId), JSON.stringify(order), true);
}

/* ============ RENDER: ROOT ============ */
function setTab(tab){
  State.view = tab;
  document.getElementById('tab-staff').classList.toggle('active', tab==='staff');
  document.getElementById('tab-admin').classList.toggle('active', tab==='admin');
  stopCamera();
  render();
}
document.getElementById('tab-staff').onclick = () => setTab('staff');
document.getElementById('tab-admin').onclick = () => setTab('admin');

async function render(){
  const main = document.getElementById('main');
  if(State.view==='admin'){
    main.innerHTML = renderAdmin();
    wireAdmin();
  } else {
    if(State.staffSub==='detail' && State.currentOrder){
      main.innerHTML = renderDetail();
      wireDetail();
    } else {
      main.innerHTML = '<div class="empty">กำลังโหลด...</div>';
      await refreshStaffList();
      main.innerHTML = renderStaffList();
      wireStaffList();
    }
  }
}

/* ============ STAFF: LIST ============ */
async function refreshStaffList(){
  await loadDateIndex();
  if(!State.dates.includes(State.date)){
    if(State.dates.length){ State.date = State.dates[0]; }
  }
  if(State.date){
    State.orders = await loadOrdersForDate(State.date);
  } else {
    State.orders = [];
  }
}

function renderStaffList(){
  const dateOptions = State.dates.length
    ? State.dates.map(d => `<option value="${d}" ${d===State.date?'selected':''}>${fmtDateTH(d)}${d===todayStr()?' (วันนี้)':''}</option>`).join('')
    : `<option>ยังไม่มีข้อมูล</option>`;

  const total = State.orders.length;
  const done = State.orders.filter(o => orderStatus(o)==='done').length;
  const progress = State.orders.filter(o => orderStatus(o)==='progress').length;

  const filtered = State.orders.filter(o => {
    if(!State.search) return true;
    const s = State.search.toLowerCase();
    return o.orderId.toLowerCase().includes(s) || (o.customer||'').toLowerCase().includes(s);
  });

  let listHtml;
  if(!State.date || total===0){
    listHtml = `<div class="empty"><div class="big">📦</div>ยังไม่มีรายการออเดอร์สำหรับวันนี้<br><span class="muted" style="font-size:13px">ไปที่แท็บ "อัปโหลดออเดอร์" เพื่อนำเข้าไฟล์รายการแพ็คของวันนี้</span></div>`;
  } else if(filtered.length===0){
    listHtml = `<div class="empty">ไม่พบออเดอร์ที่ค้นหา</div>`;
  } else {
    listHtml = filtered.map(o => {
      const st = orderStatus(o);
      const prog = orderProgress(o);
      const label = st==='done' ? 'ครบถ้วน' : st==='progress' ? 'กำลังแพ็ค' : 'รอแพ็ค';
      return `<div class="order-item ${st}" data-id="${esc(o.orderId)}">
        <div class="meta">
          <div class="oid">${esc(o.orderId)}</div>
          <div class="cust">${esc(o.customer||'-')}</div>
        </div>
        <div style="text-align:right">
          <div class="progtext">${prog.scanned}/${prog.total} ชิ้น</div>
          <span class="pill ${st}">${label}</span>
        </div>
      </div>`;
    }).join('');
  }

  return `
    <div class="row">
      <div>
        <label>วันที่รับออเดอร์</label>
        <select id="date-select">${dateOptions}</select>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="num">${total}</div><div class="lbl">ออเดอร์ทั้งหมด</div></div>
      <div class="stat"><div class="num" style="color:var(--warn)">${progress}</div><div class="lbl">กำลังแพ็ค</div></div>
      <div class="stat"><div class="num" style="color:var(--success)">${done}</div><div class="lbl">ครบแล้ว</div></div>
    </div>
    <input type="text" id="search-box" placeholder="ค้นหา Order ID หรือชื่อลูกค้า..." value="${esc(State.search)}">
    <div id="order-list">${listHtml}</div>
  `;
}

function wireStaffList(){
  const dsel = document.getElementById('date-select');
  if(dsel){
    dsel.onchange = async (e) => {
      State.date = e.target.value;
      main_loading();
      await refreshStaffList();
      document.getElementById('main').innerHTML = renderStaffList();
      wireStaffList();
    };
  }
  const sb = document.getElementById('search-box');
  if(sb){
    sb.oninput = (e) => {
      const caret = e.target.selectionStart;
      State.search = e.target.value;
      document.getElementById('main').innerHTML = renderStaffList();
      wireStaffList();
      const sb2 = document.getElementById('search-box');
      if(sb2){ sb2.focus(); sb2.setSelectionRange(caret, caret); }
    };
  }
  document.querySelectorAll('.order-item').forEach(el => {
    el.onclick = () => openOrder(el.getAttribute('data-id'));
  });
}
function main_loading(){ document.getElementById('main').innerHTML = '<div class="empty">กำลังโหลด...</div>'; }

async function openOrder(orderId){
  State.currentOrderId = orderId;
  const raw = await sGet(orderKey(State.date, orderId), true);
  State.currentOrder = raw ? JSON.parse(raw) : null;
  State.staffSub = 'detail';
  render();
}

/* ============ STAFF: DETAIL ============ */
function renderDetail(){
  const o = State.currentOrder;
  const st = orderStatus(o);
  const prog = orderProgress(o);
  const items = o.items.map((it, idx) => {
    const done = it.qtyScanned >= it.qtyRequired;
    const over = it.qtyScanned > it.qtyRequired;
    return `<div class="item-row ${done?'done':''}">
      <div class="check">${done?'✓':''}</div>
      <div class="item-info">
        <div class="name">${esc(it.name)}</div>
        <div class="code">${esc(it.code)}</div>
      </div>
      <div class="item-qty ${over?'over':''}">${it.qtyScanned}/${it.qtyRequired}</div>
      <div class="adjust">
        <button data-adj="-1" data-idx="${idx}">−</button>
        <button data-adj="1" data-idx="${idx}">+</button>
      </div>
    </div>`;
  }).join('');

  const doneBanner = st==='done' ? `<div class="banner-done">
      <div class="big">✅ แพ็คครบถ้วนแล้ว</div>
      <div class="time">อัปเดตล่าสุด ${o.updatedAt ? new Date(o.updatedAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : ''}</div>
    </div>` : '';

  return `
    <button class="back" id="back-btn">‹ กลับไปรายการออเดอร์</button>
    <div class="detail-header">
      <div class="oid mono" style="font-size:20px;font-weight:700">${esc(o.orderId)}</div>
      <div class="muted" style="font-size:13px">${esc(o.customer||'-')} · รวม ${prog.scanned}/${prog.total} ชิ้น</div>
    </div>
    ${doneBanner}
    <h2 class="section">รายการที่ต้องแพ็ค</h2>
    <div id="items-wrap">${items}</div>

    <div class="scan-bar">
      <div id="cam-wrap">
        <div id="reader"></div>
        <div class="scan-line"></div>
      </div>
      <div class="scan-input-row">
        <input type="text" id="scan-input" placeholder="ยิงบาร์โค้ด หรือพิมพ์รหัสสินค้าแล้วกด Enter" autocomplete="off" autocapitalize="off">
      </div>
      <button class="btn" id="cam-toggle">📷 เปิดกล้องสแกนบาร์โค้ด</button>
    </div>
  `;
}

function wireDetail(){
  document.getElementById('back-btn').onclick = async () => {
    await stopCamera();
    State.staffSub = 'list';
    main_loading();
    await refreshStaffList();
    render();
  };

  document.querySelectorAll('[data-adj]').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      const delta = parseInt(btn.getAttribute('data-adj'));
      const it = State.currentOrder.items[idx];
      it.qtyScanned = Math.max(0, it.qtyScanned + delta);
      await saveOrder(State.date, State.currentOrder);
      render();
    };
  });

  const input = document.getElementById('scan-input');
  input.focus();
  input.onkeydown = (e) => {
    if(e.key==='Enter'){
      const code = input.value.trim();
      input.value='';
      if(code) handleScan(code);
    }
  };

  document.getElementById('cam-toggle').onclick = async () => {
    const btn = document.getElementById('cam-toggle');
    if(State.camActive){
      await stopCamera();
      btn.textContent = '📷 เปิดกล้องสแกนบาร์โค้ด';
      btn.disabled = false;
    } else {
      btn.disabled = true;
      btn.textContent = 'กำลังเปิดกล้อง...';
      const ok = await startCamera();
      btn.disabled = false;
      btn.textContent = ok ? '⏹ ปิดกล้อง' : '📷 เปิดกล้องสแกนบาร์โค้ด';
    }
  };
}

async function handleScan(code){
  const o = State.currentOrder;
  const idx = o.items.findIndex(it => it.code.toLowerCase() === code.toLowerCase());
  if(idx === -1){
    beep('error');
    showFeedback('danger', '✕ ไม่พบรหัส "'+code+'" ในออเดอร์นี้');
    return;
  }
  const it = o.items[idx];
  if(it.qtyScanned >= it.qtyRequired){
    beep('warn');
    showFeedback('warn', '⚠ '+it.name+' ครบจำนวนแล้ว ('+it.qtyRequired+')');
    return;
  }
  it.qtyScanned++;
  await saveOrder(State.date, o);
  const allDone = orderStatus(o)==='done';
  beep(allDone ? 'done' : 'success');
  showFeedback('success', '✓ '+it.name+' ('+it.qtyScanned+'/'+it.qtyRequired+')');
  render();
  // re-focus input after re-render if camera not active
  setTimeout(() => { const inp = document.getElementById('scan-input'); if(inp) inp.focus(); }, 50);
}

/* ============ CAMERA SCANNER ============ */
let scanCooldown = false;
async function startCamera(){
  const wrap = document.getElementById('cam-wrap');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('เบราว์เซอร์/หน้าต่างนี้ไม่รองรับกล้อง (มักเกิดเมื่อเปิดผ่านหน้าพรีวิวฝังในแอปอื่น) กรุณาพิมพ์รหัสสินค้าในช่องด้านบน หรือใช้เครื่องยิงบาร์โค้ดแทน');
    return false;
  }
  if(typeof Html5Qrcode === 'undefined'){
    toast('โหลดตัวสแกนกล้องไม่สำเร็จ กรุณาใช้การพิมพ์รหัส หรือเครื่องยิงบาร์โค้ดแทน');
    return false;
  }

  wrap.classList.add('active');
  State.camActive = true;
  State.html5Qr = new Html5Qrcode('reader');
  try{
    await State.html5Qr.start(
      { facingMode: 'environment' },
      { fps: 12, qrbox: { width: 260, height: 140 } },
      (decodedText) => {
        if(scanCooldown) return;
        scanCooldown = true;
        handleScan(decodedText.trim());
        if(State.html5Qr){ try{ State.html5Qr.pause(true); }catch(e){} }
        setTimeout(() => {
          scanCooldown = false;
          if(State.html5Qr && State.camActive){ try{ State.html5Qr.resume(); }catch(e){} }
        }, 1100);
      },
      () => {}
    );
    return true;
  }catch(err){
    let msg = 'เปิดกล้องไม่สำเร็จ — กรุณาพิมพ์รหัสสินค้า หรือใช้เครื่องยิงบาร์โค้ดแทน';
    const name = (err && err.name) || '';
    if(name === 'NotAllowedError'){
      msg = 'ไม่ได้รับอนุญาตให้ใช้กล้อง (มักเกิดเมื่อเปิดหน้านี้ในโหมดพรีวิวฝังในแอปอื่น ซึ่งเบราว์เซอร์บล็อกกล้องไว้เพื่อความปลอดภัย) ลองเปิดไฟล์นี้เป็นหน้าเว็บเต็มจอโดยตรง หรือพิมพ์รหัสสินค้าแทนไปก่อน';
    } else if(name === 'NotFoundError'){
      msg = 'ไม่พบกล้องบนอุปกรณ์นี้ — พิมพ์รหัสสินค้า หรือใช้เครื่องยิงบาร์โค้ดแทน';
    }
    toast(msg);
    wrap.classList.remove('active');
    State.camActive = false;
    if(State.html5Qr){ try{ State.html5Qr.clear(); }catch(e){} }
    State.html5Qr = null;
    return false;
  }
}
async function stopCamera(){
  if(State.html5Qr && State.camActive){
    try{
      await State.html5Qr.stop();
      try{ State.html5Qr.clear(); }catch(e){}
    }catch(e){}
  }
  State.camActive = false;
  const wrap = document.getElementById('cam-wrap');
  if(wrap) wrap.classList.remove('active');
}

/* ============ ADMIN: UPLOAD ============ */
function renderAdmin(){
  if(!State.uploadParsed){
    return `
      <h2 class="section">นำเข้ารายการออเดอร์วันนี้</h2>
      <div class="card">
        <label>วันที่ของรอบแพ็คนี้</label>
        <input type="date" id="upload-date" value="${todayStr()}">
        <div class="switch-row">
          <span>ถ้าออเดอร์ซ้ำกับที่มีอยู่ในวันนั้น</span>
          <select id="merge-mode">
            <option value="merge">อัปเดตทับเฉพาะออเดอร์ที่ซ้ำ</option>
            <option value="replace">ลบของเดิมทั้งวันแล้วนำเข้าใหม่</option>
          </select>
        </div>
        <div class="file-drop" id="file-drop">
          📄 แตะเพื่อเลือกไฟล์ Excel/CSV ที่ export จาก TikTok Shop<br>
          <span style="font-size:12px">รองรับ .xlsx, .xls, .csv</span>
        </div>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none">
      </div>
      <div class="card muted" style="font-size:13px;line-height:1.6">
        ไฟล์ต้องมีคอลัมน์: หมายเลขออเดอร์ (Order ID), ชื่อสินค้า, รหัสสินค้าที่ใช้เป็นบาร์โค้ด (Seller SKU), และจำนวน — ระบบจะให้เลือกคอลัมน์เองในขั้นถัดไป
      </div>
    `;
  }

  const {headers, rows, date, mergeMode, skipRows} = State.uploadParsed;
  const guess = (keywords) => {
    const idx = headers.findIndex(h => keywords.some(k => h.toLowerCase().includes(k)));
    return idx>=0 ? idx : 0;
  };
  const gOrder = guess(['order id','order','ออเดอร์']);
  const gName = guess(['product name','ชื่อสินค้า','name']);
  const gCode = guess(['seller sku','sku']);
  const gQty = guess(['qty','quantity','จำนวน']);
  const gCust = guess(['nickname','buyer','ลูกค้า','ถึง']);

  const opts = (selectedIdx) => headers.map((h,i) => `<option value="${i}" ${i===selectedIdx?'selected':''}>${esc(h)}</option>`).join('');

  const effRows = rows.slice(skipRows||0);
  const previewRows = effRows.slice(0,4);
  const previewHtml = `
    <div class="preview-wrap">
      <table class="preview-table">
        <tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>
        ${previewRows.map(r => `<tr>${headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}</tr>`).join('')}
      </table>
    </div>`;

  return `
    <h2 class="section">จับคู่คอลัมน์ข้อมูล</h2>
    <div class="card">
      <div class="muted" style="font-size:12px;margin-bottom:10px">วันที่: ${fmtDateTH(date)} · พบ ${rows.length} แถว, ${headers.length} คอลัมน์</div>
      <label>ข้ามแถวแรก (ถ้าไฟล์มีแถวหัวข้ออธิบายซ้อนอยู่ใต้ชื่อคอลัมน์)</label>
      <input type="number" id="map-skip" min="0" max="5" value="${skipRows||0}">
      <div class="muted" style="font-size:12px;margin:-6px 0 12px">ถ้าตัวอย่างข้อมูลแถวแรกด้านล่างเป็นคำอธิบายคอลัมน์ (เช่น "Platform unique order ID") ไม่ใช่ข้อมูลจริง ให้ใส่ 1</div>
      <label>คอลัมน์ Order ID</label>
      <select id="map-order">${opts(gOrder)}</select>
      <label>คอลัมน์ชื่อสินค้า</label>
      <select id="map-name">${opts(gName)}</select>
      <label>คอลัมน์รหัสสินค้า (ใช้เป็นบาร์โค้ด เช่น Seller SKU)</label>
      <select id="map-code">${opts(gCode)}</select>
      <label>คอลัมน์จำนวน</label>
      <select id="map-qty">${opts(gQty)}</select>
      <label>คอลัมน์ชื่อลูกค้า (ไม่บังคับ)</label>
      <select id="map-cust"><option value="-1">— ไม่ใช้ —</option>${opts(gCust)}</select>
      <div class="muted" style="font-size:12px;margin:10px 0 4px">ตัวอย่างข้อมูล</div>
      ${previewHtml}
    </div>
    <div class="row">
      <button class="btn secondary" id="cancel-upload">ยกเลิก</button>
      <button class="btn" id="confirm-upload">นำเข้าข้อมูล ${effRows.length} แถว</button>
    </div>
  `;
}

function wireAdmin(){
  if(!State.uploadParsed){
    const drop = document.getElementById('file-drop');
    const finput = document.getElementById('file-input');
    drop.onclick = () => finput.click();
    finput.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const date = document.getElementById('upload-date').value || todayStr();
      const mergeMode = document.getElementById('merge-mode').value;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try{
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
          if(!json.length){ toast('ไม่พบข้อมูลในไฟล์'); return; }
          const headers = Object.keys(json[0]);
          // heuristic: detect a sub-header row (e.g. "Platform unique order ID" under "Order ID")
          let skipGuess = 0;
          const firstRow = json[0];
          const firstRowVals = headers.map(h => String(firstRow[h]||'').toLowerCase().trim());
          const headerLower = headers.map(h => h.toLowerCase().trim());
          const looksLikeSubHeader = firstRowVals.some(v => v.length>0 && (headerLower.includes(v) || /^(platform|sku |seller|buyer|quantity|order id|product name)/.test(v)));
          if(looksLikeSubHeader) skipGuess = 1;
          State.uploadParsed = {headers, rows: json, date, mergeMode, skipRows: skipGuess};
          document.getElementById('main').innerHTML = renderAdmin();
          wireAdmin();
        }catch(err){
          toast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบรูปแบบไฟล์');
        }
      };
      reader.readAsArrayBuffer(file);
    };
    return;
  }

  const skipInput = document.getElementById('map-skip');
  if(skipInput){
    skipInput.onchange = () => {
      let v = parseInt(skipInput.value);
      if(isNaN(v) || v<0) v = 0;
      State.uploadParsed.skipRows = v;
      document.getElementById('main').innerHTML = renderAdmin();
      wireAdmin();
    };
  }

  document.getElementById('cancel-upload').onclick = () => {
    State.uploadParsed = null;
    document.getElementById('main').innerHTML = renderAdmin();
    wireAdmin();
  };

  document.getElementById('confirm-upload').onclick = async () => {
    const btn = document.getElementById('confirm-upload');
    btn.disabled = true;
    btn.textContent = 'กำลังนำเข้า...';
    const {headers, rows, date, mergeMode, skipRows} = State.uploadParsed;
    const effRows = rows.slice(skipRows||0);
    const oi = parseInt(document.getElementById('map-order').value);
    const ni = parseInt(document.getElementById('map-name').value);
    const ci = parseInt(document.getElementById('map-code').value);
    const qi = parseInt(document.getElementById('map-qty').value);
    const custIdxVal = document.getElementById('map-cust').value;
    const custI = custIdxVal==='-1' ? -1 : parseInt(custIdxVal);
    const oh = headers[oi], nh = headers[ni], ch = headers[ci], qh = headers[qi], custH = custI>=0 ? headers[custI] : null;

    // group rows by order id
    const grouped = {};
    let skippedInvalid = 0;
    effRows.forEach(r => {
      const orderIdRaw = String(r[oh]||'').trim();
      const codeRaw = String(r[ch]||'').trim();
      // guard against stray sub-header / description rows or blank rows slipping through
      if(!orderIdRaw || !codeRaw){ skippedInvalid++; return; }
      const orderId = orderIdRaw;
      const code = codeRaw;
      if(!grouped[orderId]) grouped[orderId] = { orderId, customer: custH ? String(r[custH]||'').trim() : '', items: [] };
      const name = String(r[nh]||'').trim();
      let qty = parseInt(r[qh]);
      if(isNaN(qty) || qty<=0) qty = 1;
      const existing = grouped[orderId].items.find(it => it.code === code);
      if(existing){ existing.qtyRequired += qty; }
      else { grouped[orderId].items.push({ code, name, qtyRequired: qty, qtyScanned: 0 }); }
    });

    const orderIds = Object.keys(grouped);
    if(orderIds.length===0){ toast('ไม่พบออเดอร์ที่ถูกต้อง ตรวจสอบการจับคู่คอลัมน์ หรือค่า "ข้ามแถวแรก"'); btn.disabled=false; btn.textContent='นำเข้าข้อมูล'; return; }

    if(mergeMode==='replace'){
      const existingKeys = await sList('order:'+date+':', true);
      for(const k of existingKeys){
        try{ await window.storage.delete(k, true); }catch(e){}
        await sleep(120);
      }
    }

    let doneCount = 0;
    for(const orderId of orderIds){
      const order = grouped[orderId];
      order.status = 'pending';
      order.updatedAt = Date.now();
      await sSetWithRetry(orderKey(date, orderId), JSON.stringify(order), true);
      doneCount++;
      btn.textContent = 'กำลังนำเข้า... ('+doneCount+'/'+orderIds.length+')';
      await sleep(150);
    }
    await addDateToIndex(date);

    toast('นำเข้าสำเร็จ '+orderIds.length+' ออเดอร์' + (skippedInvalid ? ' (ข้าม '+skippedInvalid+' แถวที่ข้อมูลไม่ครบ)' : ''));
    State.uploadParsed = null;
    State.date = date;
    setTab('staff');
  };
}

/* ============ INIT ============ */
(async function init(){
  await refreshStaffList();
  render();
})();
</script>
