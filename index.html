<style>
  :root{
    --bg:#eef1f6;
    --surface:rgba(255,255,255,.62);
    --surface2:rgba(255,255,255,.4);
    --border:rgba(255,255,255,.55);
    --accent:#e08a00;
    --accent-2:#ff7a1a;
    --success:#1f9d5c;
    --success-dim:rgba(31,157,92,.14);
    --danger:#e5484d;
    --danger-dim:rgba(229,72,77,.14);
    --warn:#e08a00;
    --warn-dim:rgba(224,138,0,.16);
    --text:#1b2430;
    --muted:#5b6672;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Oswald',sans-serif;
    --body:'Inter',sans-serif;
    --glass-shadow:0 8px 32px rgba(31,45,61,.10), 0 1px 1px rgba(255,255,255,.6) inset;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 8%, rgba(255,167,53,.35), transparent 42%),
      radial-gradient(circle at 92% 18%, rgba(255,122,26,.28), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(96,165,250,.25), transparent 45%),
      radial-gradient(circle at 90% 92%, rgba(167,139,250,.22), transparent 45%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:transparent;position:relative;}

  /* ---- barcode stripe header ---- */
  .stripes{
    height:10px;width:100%;
    background:repeating-linear-gradient(90deg,var(--accent) 0 3px, transparent 3px 6px, var(--accent-2) 6px 8px, transparent 8px 13px, var(--accent) 13px 16px, transparent 16px 22px);
    opacity:.9;
  }
  header.top{
    padding:18px 18px 14px;
    background:var(--surface);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--border);
  }
  header.top .brand{
    font-family:var(--disp);
    font-weight:700;
    font-size:22px;
    letter-spacing:.5px;
    text-transform:uppercase;
    display:flex;align-items:baseline;gap:8px;
  }
  header.top .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);align-self:center;}
  header.top .brand .by{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.2px;text-transform:none;color:var(--muted);}
  header.top .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  header.top .brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .staff-badge{
    flex-shrink:0;background:var(--surface2);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid var(--border);color:var(--text);font-family:var(--body);font-weight:600;font-size:12.5px;
    padding:7px 12px;border-radius:20px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;max-width:150px;
  }
  .staff-badge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .staff-badge:active{transform:scale(.96);}

  .modal-overlay{
    display:none;position:fixed;inset:0;z-index:200;background:rgba(20,25,35,.35);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    width:100%;max-width:380px;background:rgba(255,255,255,.85);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(15,25,40,.25), 0 1px 0 rgba(255,255,255,.7) inset;
  }
  .modal-title{font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;margin-bottom:6px;}
  .modal-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px;}
  .modal-card input[type=text]{font-size:16px;}
  .modal-card .row > *{width:auto;}

  nav.tabs{
    display:flex;gap:0;background:var(--surface);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  nav.tabs button{
    flex:1;padding:13px 6px;background:none;border:none;color:var(--muted);
    font-family:var(--disp);font-size:12.5px;letter-spacing:.2px;text-transform:uppercase;font-weight:600;
    border-bottom:3px solid transparent;cursor:pointer;
  }
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{flex:1;padding:16px;padding-bottom:90px;}

  /* generic */
  .card{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--glass-shadow);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--disp);font-weight:600;letter-spacing:.3px;text-transform:uppercase;font-size:14px;
    padding:13px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.5);cursor:pointer;
    background:linear-gradient(155deg,var(--accent-2),var(--accent));color:#1a1305;width:100%;
    box-shadow:0 6px 16px rgba(224,138,0,.35), 0 1px 0 rgba(255,255,255,.5) inset;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.98);box-shadow:0 3px 10px rgba(224,138,0,.3), 0 1px 0 rgba(255,255,255,.5) inset;}
  .btn.secondary{background:var(--surface2);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--text);border-color:var(--border);box-shadow:var(--glass-shadow);}
  .btn.danger{background:linear-gradient(155deg,#f16468,var(--danger));color:#2b0505;}
  .btn.ghost{background:rgba(255,255,255,.25);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--accent);border-color:var(--border);box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  input[type=text],input[type=date],input[type=number],select{
    width:100%;background:var(--surface2);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--border);color:var(--text);
    padding:11px 12px;border-radius:12px;font-size:15px;font-family:var(--body);margin-bottom:12px;
  }
  select{appearance:none;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

<script>
/* ============ FIREBASE CONFIG ============
   วางค่าที่ได้จาก Firebase Console ตรงนี้ (ดูวิธีได้จากที่ Claude อธิบายในแชท)
   ถ้ายังไม่ตั้งค่า (apiKey ยังเป็น "YOUR_API_KEY") แอปจะขึ้นเตือนให้ตั้งค่าก่อนใช้งานจริง
*/
const firebaseConfig = {
  apiKey: "AIzaSyCT8RBUMuyJTdmMD2gXUo3kZSppZumEBSA",
  authDomain: "pack-check-1706d.firebaseapp.com",
  projectId: "pack-check-1706d",
  storageBucket: "pack-check-1706d.firebasestorage.app",
  messagingSenderId: "797522845440",
  appId: "1:797522845440:web:d2c169251e1a1c47e3dde5"
};

let db = null;
let backendReady = false;
try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    backendReady = true;
  }
}catch(e){ console.error('firebase init failed', e); backendReady = false; }

function sanitizeDocId(key){
  // Firestore doc IDs: no "/", not "." or "..", not matching __.*__
  return String(key).replace(/\//g, '_').slice(0, 1500) || '_';
}

/* ============ STORAGE HELPERS (Firestore-backed) ============ */
async function rawGet(key){
  if(!backendReady) return null;
  const doc = await db.collection('packcheck').doc(sanitizeDocId(key)).get();
  return doc.exists ? doc.data().value : null;
}
async function rawSet(key, value){
  if(!backendReady) throw new Error('backend not configured');
  await db.collection('packcheck').doc(sanitizeDocId(key)).set({ value: value, updatedAt: Date.now() });
  return true;
}
async function rawList(prefix){
  if(!backendReady) return [];
  const snap = await db.collection('packcheck')
    .orderBy(firebase.firestore.FieldPath.documentId())
    .startAt(prefix)
    .endAt(prefix + '\uf8ff')
    .get();
  return snap.docs.map(d => d.id);
}
async function rawDelete(key){
  if(!backendReady) return;
  await db.collection('packcheck').doc(sanitizeDocId(key)).delete();
}

async function sGet(key, shared){
  try{ return await rawGet(key); }
  catch(e){ console.error('get failed', key, e); return null; }
}
async function sSet(key, value, shared){
  try{ return await rawSet(key, value); }
  catch(e){ console.error('storage set failed', key, e); return null; }
}
async function sList(prefix, shared){
  try{ return await rawList(prefix); }
  catch(e){ console.error('list failed', prefix, e); return []; }
}
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }
async function sSetWithRetry(key, value, shared, maxRetries){
  maxRetries = maxRetries || 6;
  let attempt = 0;
  while(attempt <= maxRetries){
    try{ return await rawSet(key, value); }
    catch(e){
      attempt++;
      if(attempt > maxRetries){ console.error('storage set gave up', key, e); return null; }
      await sleep(400 * attempt);
    }
  }
}
async function sDelete(key){
  try{ await rawDelete(key); }catch(e){ console.error('delete failed', key, e); }
}

/* ============ UTIL ============ */
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function fmtDateTH(dstr){
  const [y,m,d] = dstr.split('-');
  return d+'/'+m+'/'+y;
}
function nowTime(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes());
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Excel files that group several product rows under one order (like TikTok Shop's native
   export) usually store the Order ID / customer / tracking columns as a single MERGED cell
   spanning those rows. SheetJS only keeps the value on the first (top-left) cell of a merge —
   every other cell in that merged range is empty in the underlying sheet — so a plain
   sheet_to_json() reads those "continuation" rows as blank order IDs and they get silently
   skipped, dropping legitimate items from multi-item orders. Fill merged ranges with their
   top-left value before parsing so every row keeps its order ID. Safe no-op on files with no
   merged cells (most already-flat exports/templates). */
function fillMergedCells(sheet){
  const merges = sheet['!merges'];
  if(!merges || !merges.length) return;
  merges.forEach(range => {
    const topLeftAddr = XLSX.utils.encode_cell({ r: range.s.r, c: range.s.c });
    const topLeftCell = sheet[topLeftAddr];
    if(!topLeftCell) return;
    for(let r = range.s.r; r <= range.e.r; r++){
      for(let c = range.s.c; c <= range.e.c; c++){
        if(r === range.s.r && c === range.s.c) continue;
        const addr = XLSX.utils.encode_cell({ r, c });
        const cell = sheet[addr];
        if(!cell || cell.v === undefined || cell.v === ''){
          sheet[addr] = { t: topLeftCell.t, v: topLeftCell.v };
        }
      }
    }
  });
}

/* ============ STAFF NAME (local, for audit trail) ============ */
const STAFF_NAME_KEY = 'packcheck_staff_name';
function loadStaffName(){
  try{ State.staffName = localStorage.getItem(STAFF_NAME_KEY) || ''; }catch(e){ State.staffName = ''; }
  updateStaffBadge();
}
function updateStaffBadge(){
  const el = document.getElementById('staff-badge-name');

function openStaffModal(){

function saveStaffName(){

let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

/* beep via WebAudio, no external asset */
function beep(type){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    let freq = 880, dur = 0.12;
    if(type==='error'){ freq=180; dur=0.28; }
    if(type==='warn'){ freq=420; dur=0.16; }
    if(type==='done'){ freq=1200; dur=0.35; }
    o.frequency.value = freq;
    o.type = type==='error' ? 'sawtooth' : 'sine';
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur+0.02);
    setTimeout(()=>ctx.close(), (dur+0.1)*1000);
  }catch(e){}
}

function speakPackDone(){
  try{
    if(!('speechSynthesis' in window)) return;
    const say = () => {
      const u = new SpeechSynthesisUtterance('แพคครบแล้ว');
      u.lang = 'th-TH';
      u.pitch = 1.7;   // สูงขึ้น ให้ฟังดูเป็นเสียงเด็กผู้หญิง
      u.rate = 1.05;
      u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const thVoice =
        voices.find(v => /^th/i.test(v.lang) && /female|หญิง/i.test(v.name)) ||
        voices.find(v => /^th/i.test(v.lang)) ||
        null;
      if(thVoice) u.voice = thVoice;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.getVoices().length === 0){
      // เสียงบางทียังโหลดไม่เสร็จตอนเปิดหน้าเว็บครั้งแรก
      speechSynthesis.onvoiceschanged = say;
    } else {
      say();
    }
  }catch(e){}
}

function showFeedback(kind, text){
  const f = document.getElementById('feedback');
  f.className = 'feedback show ' + kind;
  f.textContent = text;
  clearTimeout(showFeedback._t);
  showFeedback._t = setTimeout(()=>{ f.className='feedback '+kind; }, 1400);
}

/* ============ DATA LAYER ============ */
async function loadDateIndex(){
  const raw = await sGet('dateindex', true);
  let arr = [];
  try{ arr = raw ? JSON.parse(raw) : []; }catch(e){ arr=[]; }
  if(!arr.includes(todayStr())){ /* don't force-add; only real uploaded dates matter */ }
  arr.sort().reverse();
  State.dates = arr;
  return arr;
}
async function addDateToIndex(date){
  const raw = await sGet('dateindex', true);
  let arr = [];
  try{ arr = raw ? JSON.parse(raw) : []; }catch(e){ arr=[]; }
  if(!arr.includes(date)){ arr.push(date); await sSet('dateindex', JSON.stringify(arr), true); }
}
async function removeDateFromIndex(date){
  const raw = await sGet('dateindex', true);
  let arr = [];
  try{ arr = raw ? JSON.parse(raw) : []; }catch(e){ arr=[]; }
  arr = arr.filter(d => d !== date);
  await sSet('dateindex', JSON.stringify(arr), true);
}
async function clearOrdersForDate(date){
  const keys = await sList('order:'+date+':', true);
  for(const k of keys){
    await sDelete(k);
    await sleep(100);
  }
  await removeDateFromIndex(date);
}

async function sGetWithRetry(key, shared, maxRetries){
  maxRetries = maxRetries || 4;
  let attempt = 0;
  while(attempt <= maxRetries){
    try{ return await rawGet(key); }
    catch(e){
      attempt++;
      if(attempt > maxRetries) return null;
      await sleep(300 * attempt);
    }
  }
}
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let i = 0;
  async function worker(){
    while(i < items.length){
      const idx = i++;
      results[idx] = await fn(items[idx], idx);
    }
  }
  const workers = Array.from({length: Math.min(limit, items.length)}, worker);
  await Promise.all(workers);
  return results;
}

async function loadOrdersForDate(date){
  const keys = await sList('order:'+date+':', true);
  const results = await mapWithConcurrency(keys, 6, async k => {
    const v = await sGetWithRetry(k, true);
    if(!v) return null;
    try{ return JSON.parse(v); }catch(e){ return null; }
  });
  const orders = results.filter(Boolean);
  orders.sort((a,b) => {
    const sa = orderStatus(a), sb = orderStatus(b);
    const rank = {pending:0, progress:1, done:2};
    if(rank[sa]!==rank[sb]) return rank[sa]-rank[sb];
    return a.orderId.localeCompare(b.orderId);
  });
  return orders;
}
function sanitizeKeyPart(s){
  return String(s==null?'':s).trim().replace(/[\s\/\\'"]+/g, '_').slice(0, 120);
}
function orderKey(date, orderId){ return 'order:'+date+':'+sanitizeKeyPart(orderId); }

async function refreshPrintCodes(){
  await loadDateIndex();
  const map = {}; // code -> name
  for(const date of State.dates){
    const orders = await loadOrdersForDate(date);
    orders.forEach(o => {
      o.items.forEach(it => {
        if(it.code) map[it.code] = it.name || map[it.code] || '';
      });
    });
  }
  // also include codes registered via "ตั้งค่าเซท" (components), so products can be
  // pre-registered with a barcode/photo before they ever appear in an actual order —
  // this also covers standalone no-SKU products added as a 1-item "set"
  const setKeys = await sList('set:', true);
  const setDefsRaw = await mapWithConcurrency(setKeys, 6, async k => {
    const v = await sGetWithRetry(k, true);
    if(!v) return null;
    try{ return JSON.parse(v); }catch(e){ return null; }
  });
  setDefsRaw.filter(Boolean).forEach(def => {
    (def.components||[]).forEach(c => { if(c.code) map[c.code] = c.name || map[c.code] || ''; });
  });

  const list = Object.keys(map).map(code => ({ code, name: map[code] }));
  list.sort((a,b) => a.code.localeCompare(b.code));
  State.printCodes = list;
  list.forEach(it => { if(!(it.code in State.printQty)) State.printQty[it.code] = 1; });

  // bulk-load thumbnails not yet cached, limited concurrency
  const toLoad = list.filter(it => !(it.code in State.photoCache));
  await mapWithConcurrency(toLoad, 6, async it => {
    const v = await sGetWithRetry('photo:'+sanitizeKeyPart(it.code), true);
    State.photoCache[it.code] = v || null;
  });
}

function photoKey(code){ return 'photo:'+sanitizeKeyPart(code); }

async function getPhotoForCode(code){
  if(code in State.photoCache) return State.photoCache[code];
  const v = await sGetWithRetry(photoKey(code), true);
  State.photoCache[code] = v || null;
  return State.photoCache[code];
}

function resizeImageFile(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality||0.72));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ SET (BUNDLE) DEFINITIONS ============ */
function setKey(matchBy, value){ return 'set:'+matchBy+':'+sanitizeKeyPart(value); }
function normName(s){ return String(s||'').trim().toLowerCase(); }

// normalize legacy defs (saved before matchBy existed) to the new shape
function normalizeSetDef(def){
  if(!def.matchBy){ def.matchBy = 'code'; def.matchValue = def.code || ''; }
  if(!('matchValue' in def)) def.matchValue = def.code || '';
  return def;
}

async function refreshSets(){
  await refreshPrintCodes(); // so we have the code+name catalog for the picker
  const keys = await sList('set:', true);
  const results = await mapWithConcurrency(keys, 6, async k => {
    const v = await sGetWithRetry(k, true);
    if(!v) return null;
    try{ return normalizeSetDef(JSON.parse(v)); }catch(e){ return null; }
  });
  State.setList = results.filter(Boolean).sort((a,b) => (a.matchValue||'').localeCompare(b.matchValue||''));
}

async function loadAllSetDefs(){
  const keys = await sList('set:', true);
  const byCode = {}, byName = {};
  const results = await mapWithConcurrency(keys, 6, async k => {
    const v = await sGetWithRetry(k, true);
    if(!v) return null;
    try{ return normalizeSetDef(JSON.parse(v)); }catch(e){ return null; }
  });
  results.filter(Boolean).forEach(def => {
    if(def.matchBy==='name') byName[normName(def.matchValue)] = def;
    else byCode[def.matchValue] = def;
  });
  return { byCode, byName };
}

function orderStatus(order){
  let total=0, scanned=0;
  order.items.forEach(it => { total += it.qtyRequired; scanned += Math.min(it.qtyScanned, it.qtyRequired); });
  if(scanned===0) return 'pending';
  if(scanned>=total) return 'done';
  return 'progress';
}
function orderProgress(order){
  let total=0, scanned=0;
  order.items.forEach(it => { total += it.qtyRequired; scanned += Math.min(it.qtyScanned, it.qtyRequired); });
  return {scanned, total};
}

async function saveOrder(date, order){
  order.updatedAt = Date.now();
  await sSet(orderKey(date, order.orderId), JSON.stringify(order), true);
}

async function refreshStaffList(){
  await loadDateIndex();
  if(!State.dates.includes(State.date)){
    if(State.dates.length){ State.date = State.dates[0]; }
  }
  if(State.date){
    State.orders = await loadOrdersForDate(State.date);
  } else {
    State.orders = [];
  }

  // aggregate total PACKED (scanned) qty per product across today's orders — this reflects
  // what actually shipped out so far, not what was merely ordered
  const map = {}; // code -> {name, qty}
  State.orders.forEach(o => {
    o.items.forEach(it => {
      if(!it.qtyScanned) return;
      if(!map[it.code]) map[it.code] = { code: it.code, name: it.name || it.code, qty: 0 };
      map[it.code].qty += it.qtyScanned;
    });
  });
  const summary = Object.values(map).sort((a,b) => b.qty - a.qty);
  State.dailySummary = summary;

  // preload thumbnails for the summary in the BACKGROUND — fetching each one is a network
  // round trip, and awaiting all of them here was blocking the whole page from showing
  // anything until every photo arrived (slow/flaky connections made this feel like the
  // app had frozen). Kick it off without awaiting, and patch the screen once it's done.
  const toLoad = summary.filter(it => !(it.code in State.photoCache));
  if(toLoad.length){
    mapWithConcurrency(toLoad, 6, async it => {
      const v = await sGetWithRetry(photoKey(it.code), true);
      State.photoCache[it.code] = v || null;
    }).then(() => {
      if(State.view==='staff' && State.staffSub==='list'){
        document.getElementById('main').innerHTML = renderStaffList();
        wireStaffList();
      }
    });
  }
}

function exportStockReport(date, orders){
  if(!date || !orders || orders.length===0){ toast('ไม่มีออเดอร์ของวันนี้ให้สรุป'); return; }

  // sum up what was ACTUALLY scanned/packed per product code — this is what physically
  // left the warehouse today, so it's the correct number to deduct from stock (not the
  // ordered qty, which may be higher if an order was only partially packed)
  const totals = {}; // code -> {name, qtyPacked, orderCount}
  orders.forEach(o => {
    o.items.forEach(it => {
      if(!it.qtyScanned) return;
      if(!totals[it.code]) totals[it.code] = { name: it.name || it.code, qtyPacked: 0, orderCount: 0 };
      totals[it.code].qtyPacked += it.qtyScanned;
      totals[it.code].orderCount += 1;
    });
  });

  const codes = Object.keys(totals).sort((a,b) => a.localeCompare(b));
  if(codes.length===0){ toast('ยังไม่มีสินค้าที่สแกนแพ็คเลยในวันนี้'); return; }

  const doneCount = orders.filter(o => orderStatus(o)==='done').length;
  const notDoneCount = orders.length - doneCount;

  const wsData = [
    ['รหัสสินค้า (SKU)', 'ชื่อสินค้า', 'จำนวนที่แพ็คไป (ชิ้น)', 'จำนวนออเดอร์ที่มีสินค้านี้'],
    ...codes.map(c => [c, totals[c].name, totals[c].qtyPacked, totals[c].orderCount]),
    [],
    ['รวมออเดอร์ทั้งหมดของวันนี้', orders.length],
    ['ออเดอร์ที่แพ็คครบแล้ว', doneCount]
  ];
  if(notDoneCount>0) wsData.push(['ออเดอร์ที่ยังแพ็คไม่ครบ (ตัวเลขด้านบนนับเฉพาะชิ้นที่สแกนจริงเท่านั้น)', notDoneCount]);

  // --- who packed which order ---
  const byOrderData = [
    ['Order ID', 'ลูกค้า', 'เลขพัสดุ', 'สถานะ', 'แพ็คแล้ว/ทั้งหมด (ชิ้น)', 'แพ็คโดย']
  ];
  orders.forEach(o => {
    const prog = orderProgress(o);
    const status = orderStatus(o)==='done' ? 'ครบแล้ว' : (prog.scanned>0 ? 'แพ็คบางส่วน' : 'ยังไม่แพ็ค');
    byOrderData.push([o.orderId, o.customer||'-', o.tracking||'-', status, prog.scanned+'/'+prog.total, o.packedBy||'-']);
  });

  // --- totals per staff member, from the scan activity log (falls back to the order's
  // last-known packer for older orders scanned before per-scan logging existed) ---
  const staffTotals = {}; // name -> {items, orderIds:Set}
  const bump = (name, orderId, count) => {
    const key = name || 'ไม่ระบุชื่อ';
    if(!staffTotals[key]) staffTotals[key] = { items: 0, orderIds: new Set() };
    staffTotals[key].items += count;
    staffTotals[key].orderIds.add(orderId);
  };
  orders.forEach(o => {
    const totalScanned = o.items.reduce((s,it) => s + (it.qtyScanned||0), 0);
    if(totalScanned===0) return;
    if(Array.isArray(o.activityLog) && o.activityLog.length){
      o.activityLog.forEach(entry => bump(entry.staff, o.orderId, 1));
    } else {
      // no per-scan log on this order — attribute its whole scanned qty to whoever
      // last touched it (best-effort estimate, noted in the sheet)
      bump(o.packedBy, o.orderId, totalScanned);
    }
  });
  const staffNames = Object.keys(staffTotals).sort((a,b) => staffTotals[b].items - staffTotals[a].items);
  const byStaffData = [
    ['พนักงาน', 'จำนวนชิ้นที่สแกน', 'จำนวนออเดอร์ที่เกี่ยวข้อง'],
    ...staffNames.map(n => [n, staffTotals[n].items, staffTotals[n].orderIds.size]),
    [],
    ['หมายเหตุ', 'ออเดอร์ที่แพ็คก่อนมีระบบบันทึกชื่อผู้แพ็ค จะนับรวมไว้ที่ "ไม่ระบุชื่อ" หรือใช้ชื่อล่าสุดที่แตะออเดอร์นั้นเป็นตัวประมาณ']
  ];

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:16},{wch:50},{wch:20},{wch:24}];
  const wsByOrder = XLSX.utils.aoa_to_sheet(byOrderData);
  wsByOrder['!cols'] = [{wch:22},{wch:22},{wch:20},{wch:14},{wch:18},{wch:16}];
  const wsByStaff = XLSX.utils.aoa_to_sheet(byStaffData);
  wsByStaff['!cols'] = [{wch:18},{wch:18},{wch:22}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'สรุปสต็อก');
  XLSX.utils.book_append_sheet(wb, wsByOrder, 'แพ็คโดย (แยกออเดอร์)');
  XLSX.utils.book_append_sheet(wb, wsByStaff, 'สรุปตามพนักงาน');
  XLSX.writeFile(wb, 'สรุปสต็อกที่แพ็ค_'+date+'.xlsx');

  toast(notDoneCount>0
    ? 'Export แล้ว (ยังมี '+notDoneCount+' ออเดอร์แพ็คไม่ครบ — นับเฉพาะที่สแกนจริง)'
    : 'Export สรุปสต็อกสำเร็จ');
}

function wireDetail(){
  document.getElementById('back-btn').onclick = async () => {
    await stopCamera();
    State.staffSub = 'list';
    main_loading();
    await refreshStaffList();
    render();
  };

  document.querySelectorAll('[data-adj]').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      const delta = parseInt(btn.getAttribute('data-adj'));
      const it = State.currentOrder.items[idx];
      it.qtyScanned = Math.max(0, it.qtyScanned + delta);
      await saveOrder(State.date, State.currentOrder);
      render();
    };
  });

  const undoBtn = document.getElementById('undo-scan-btn');
  if(undoBtn) undoBtn.onclick = undoLastScan;

  const input = document.getElementById('scan-input');
  input.focus();
  input.onkeydown = (e) => {
    if(e.key==='Enter'){
      const code = input.value.trim();
      input.value='';
      if(code) handleScan(code);
    }
  };

  document.getElementById('cam-toggle').onclick = async () => {
    const btn = document.getElementById('cam-toggle');
    if(State.camActive){
      await stopCamera();
      btn.textContent = '📷 เปิดกล้องสแกนบาร์โค้ด';
      btn.disabled = false;
    } else {
      btn.disabled = true;
      btn.textContent = 'กำลังเปิดกล้อง...';
      const ok = await startCamera();
      btn.disabled = false;
      btn.textContent = ok ? '⏹ ปิดกล้อง' : '📷 เปิดกล้องสแกนบาร์โค้ด';
    }
  };
}

async function handleScan(code){
  const o = State.currentOrder;
  const idx = o.items.findIndex(it => it.code.toLowerCase() === code.toLowerCase());
  if(idx === -1){
    beep('error');
    showFeedback('danger', '✕ ไม่พบรหัส "'+code+'" ในออเดอร์นี้');
    return;
  }
  const it = o.items[idx];
  if(it.qtyScanned >= it.qtyRequired){
    beep('warn');
    showFeedback('warn', '⚠ '+it.name+' ครบจำนวนแล้ว ('+it.qtyRequired+')');
    return;
  }
  it.qtyScanned++;
  const staff = State.staffName || 'ไม่ระบุชื่อ';
  o.packedBy = staff;
  if(!Array.isArray(o.activityLog)) o.activityLog = [];
  o.activityLog.push({ ts: Date.now(), staff, code: it.code, name: it.name });
  if(o.activityLog.length > 300) o.activityLog = o.activityLog.slice(-300); // cap doc size
  State.lastScan = { orderId: o.orderId, code: it.code, idx, ts: Date.now() };
  await saveOrder(State.date, o);
  const allDone = orderStatus(o)==='done';
  beep(allDone ? 'done' : 'success');

  if(allDone){
    showFeedback('success', '✅ แพ็คออเดอร์ '+o.orderId+' ครบแล้ว! ไปสแกนใบปะหน้าถัดไปได้เลย');
    speakPackDone();
    render();
    // brief pause so staff sees the "done" state, then loop back to the label-scan screen automatically
    setTimeout(async () => {
      await stopCamera();
      State.staffSub = 'list';
      main_loading();
      await refreshStaffList();
      render();
      const orderInp = document.getElementById('order-scan-input');
      if(orderInp) orderInp.focus();
    }, 1300);
    return;
  }

  showFeedback('success', '✓ '+it.name+' ('+it.qtyScanned+'/'+it.qtyRequired+')');
  render();
  // re-focus input after re-render if camera not active
  setTimeout(() => { const inp = document.getElementById('scan-input'); if(inp) inp.focus(); }, 50);
}

async function undoLastScan(){
  const ls = State.lastScan;
  const o = State.currentOrder;
  if(!ls || !o || ls.orderId !== o.orderId) return;
  const it = o.items[ls.idx];
  if(!it || it.code !== ls.code){ State.lastScan = null; render(); return; }
  if(it.qtyScanned <= 0){ State.lastScan = null; render(); return; }
  it.qtyScanned--;
  if(Array.isArray(o.activityLog) && o.activityLog.length){
    // remove the most recent matching log entry (the one this undo reverts)
    const last = o.activityLog[o.activityLog.length - 1];
    if(last && last.code === ls.code) o.activityLog.pop();
  }
  await saveOrder(State.date, o);
  beep('warn');
  showFeedback('warn', '↩️ ยกเลิกแล้ว: '+it.name);
  State.lastScan = null;
  render();
  setTimeout(() => { const inp = document.getElementById('scan-input'); if(inp) inp.focus(); }, 50);
}

async function handleOrderLookupScan(raw){
  const code = raw.trim();
  if(!code) return;
  let match = State.orders.find(o => o.orderId === code || (o.tracking && o.tracking === code) || (Array.isArray(o.originalOrderIds) && o.originalOrderIds.includes(code)));
  if(!match){
    // fallback: loose contains-match, in case the scanned QR/barcode has extra characters around the number
    match = State.orders.find(o => (o.tracking && (code.includes(o.tracking) || o.tracking.includes(code))) || code.includes(o.orderId));
  }
  if(!match){
    beep('error');
    showFeedback('danger', '✕ ไม่พบออเดอร์ที่ตรงกับ "'+code+'" ในวันที่ '+fmtDateTH(State.date));
    return;
  }
  beep('success');
  await stopCamera();
  await openOrder(match.orderId);
}

/* ============ CAMERA SCANNER ============ */
let scanCooldown = false;
async function startCamera(onDecode){
  onDecode = onDecode || handleScan;
  const wrap = document.getElementById('cam-wrap');

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('เบราว์เซอร์/หน้าต่างนี้ไม่รองรับกล้อง (มักเกิดเมื่อเปิดผ่านหน้าพรีวิวฝังในแอปอื่น) กรุณาพิมพ์รหัสในช่องด้านบน หรือใช้เครื่องยิงบาร์โค้ดแทน');
    return false;
  }
  if(typeof Html5Qrcode === 'undefined'){
    toast('โหลดตัวสแกนกล้องไม่สำเร็จ กรุณาใช้การพิมพ์รหัส หรือเครื่องยิงบาร์โค้ดแทน');
    return false;
  }

  wrap.classList.add('active');
  State.camActive = true;

  // try the enhanced config first (narrower format list + native BarcodeDetector where
  // available, for faster/more reliable decoding); if any device rejects it for any
  // reason, fall back to the plainest possible config rather than failing outright
  const attempts = [
    {
      constructorConfig: {
        formatsToSupport: (typeof Html5QrcodeSupportedFormats !== 'undefined')
          ? [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128]
          : undefined,
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      },
      cameraConfig: { facingMode: 'environment' }
    },
    { constructorConfig: undefined, cameraConfig: { facingMode: 'environment' } }
  ];

  let lastErr = null;
  for(const attempt of attempts){
    try{
      State.html5Qr = attempt.constructorConfig
        ? new Html5Qrcode('reader', attempt.constructorConfig)
        : new Html5Qrcode('reader');
      await State.html5Qr.start(
        attempt.cameraConfig,
        {
          fps: 12,
          qrbox: (viewfinderW, viewfinderH) => {
            // a wide rectangle rather than a tight square — 1D barcodes are much wider
            // than they are tall, and a square box sized to the smaller edge can crop
            // the ends of the barcode. Still tall enough for a QR code to fit too.
            const w = Math.floor(Math.min(viewfinderW * 0.88, viewfinderH * 1.5));
            const h = Math.floor(Math.min(viewfinderH * 0.55, viewfinderW * 0.62));
            return { width: w, height: h };
          }
        },
        (decodedText) => {
          if(scanCooldown) return;
          scanCooldown = true;
          onDecode(decodedText.trim());
          if(State.html5Qr){ try{ State.html5Qr.pause(true); }catch(e){} }
          setTimeout(() => {
            scanCooldown = false;
            if(State.html5Qr && State.camActive){ try{ State.html5Qr.resume(); }catch(e){} }
          }, 1100);
        },
        () => {}
      );
      return true;
    }catch(err){
      lastErr = err;
      if(State.html5Qr){ try{ await State.html5Qr.clear(); }catch(e){} }
      State.html5Qr = null;
      // NotAllowedError/NotFoundError mean the fallback won't help either — stop retrying
      const name = (err && err.name) || '';
      if(name === 'NotAllowedError' || name === 'NotFoundError') break;
    }
  }

  {
    const err = lastErr;
    let msg = 'เปิดกล้องไม่สำเร็จ — กรุณาพิมพ์รหัส หรือใช้เครื่องยิงบาร์โค้ดแทน';
    const name = (err && err.name) || '';
    if(name === 'NotAllowedError'){
      msg = 'ไม่ได้รับอนุญาตให้ใช้กล้อง (มักเกิดเมื่อเปิดหน้านี้ในโหมดพรีวิวฝังในแอปอื่น ซึ่งเบราว์เซอร์บล็อกกล้องไว้เพื่อความปลอดภัย) ลองเปิดไฟล์นี้เป็นหน้าเว็บเต็มจอโดยตรง หรือพิมพ์รหัสแทนไปก่อน';
    } else if(name === 'NotFoundError'){
      msg = 'ไม่พบกล้องบนอุปกรณ์นี้ — พิมพ์รหัส หรือใช้เครื่องยิงบาร์โค้ดแทน';
    }
    toast(msg);
    wrap.classList.remove('active');
    State.camActive = false;
    return false;
  }
}
async function stopCamera(){
  if(State.html5Qr && State.camActive){
    try{
      await State.html5Qr.stop();
      try{ State.html5Qr.clear(); }catch(e){}
    }catch(e){}
  }
  State.camActive = false;
  const wrap = document.getElementById('cam-wrap');
  if(wrap) wrap.classList.remove('active');
}

function wireAdmin(){
  if(!State.uploadParsed){
    const drop = document.getElementById('file-drop');
    const finput = document.getElementById('file-input');
    drop.onclick = () => finput.click();
    finput.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const date = document.getElementById('upload-date').value || todayStr();
      const mergeMode = document.getElementById('merge-mode').value;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try{
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          fillMergedCells(sheet);
          const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
          if(!json.length){ toast('ไม่พบข้อมูลในไฟล์'); return; }
          const headers = Object.keys(json[0]);
          // heuristic: detect a sub-header row (e.g. "Platform unique order ID" under "Order ID")
          let skipGuess = 0;
          const firstRow = json[0];
          const firstRowVals = headers.map(h => String(firstRow[h]||'').toLowerCase().trim());
          const headerLower = headers.map(h => h.toLowerCase().trim());
          const looksLikeSubHeader = firstRowVals.some(v => v.length>0 && (headerLower.includes(v) || /^(platform|sku |seller|buyer|quantity|order id|product name)/.test(v)));
          if(looksLikeSubHeader) skipGuess = 1;
          State.uploadParsed = {headers, rows: json, date, mergeMode, skipRows: skipGuess};
          document.getElementById('main').innerHTML = renderAdmin();
          wireAdmin();
        }catch(err){
          toast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบรูปแบบไฟล์');
        }
      };
      reader.readAsArrayBuffer(file);
    };
    return;
  }

  const skipInput = document.getElementById('map-skip');
  if(skipInput){
    skipInput.onchange = () => {
      let v = parseInt(skipInput.value);
      if(isNaN(v) || v<0) v = 0;
      State.uploadParsed.skipRows = v;
      document.getElementById('main').innerHTML = renderAdmin();
      wireAdmin();
    };
  }

  const mergeModeSelect = document.getElementById('map-merge-mode');
  if(mergeModeSelect){
    mergeModeSelect.onchange = () => {
      State.uploadParsed.mergeMode = mergeModeSelect.value;
    };
  }

  document.getElementById('cancel-upload').onclick = () => {
    State.uploadParsed = null;
    document.getElementById('main').innerHTML = renderAdmin();
    wireAdmin();
  };

  document.getElementById('confirm-upload').onclick = async () => {
    if(!backendReady){
      toast('ยังไม่ได้ตั้งค่าฐานข้อมูล (Firebase) — ระบบยังบันทึกข้อมูลไม่ได้ ดูคำแนะนำการตั้งค่าด้านบนก่อน');
      return;
    }
    const btn = document.getElementById('confirm-upload');
    btn.disabled = true;
    btn.textContent = 'กำลังนำเข้า...';
    const {headers, rows, date, mergeMode, skipRows} = State.uploadParsed;
    const effRows = rows.slice(skipRows||0);
    const oi = parseInt(document.getElementById('map-order').value);
    const ni = parseInt(document.getElementById('map-name').value);
    const ci = parseInt(document.getElementById('map-code').value);
    const qi = parseInt(document.getElementById('map-qty').value);
    const custIdxVal = document.getElementById('map-cust').value;
    const custI = custIdxVal==='-1' ? -1 : parseInt(custIdxVal);
    const trackIdxVal = document.getElementById('map-track').value;
    const trackI = trackIdxVal==='-1' ? -1 : parseInt(trackIdxVal);
    const oh = headers[oi], nh = headers[ni], ch = headers[ci], qh = headers[qi], custH = custI>=0 ? headers[custI] : null, trackH = trackI>=0 ? headers[trackI] : null;

    const setDefs = await loadAllSetDefs();

    // group rows by order id (expanding any "set/bundle" SKUs into their component items)
    const grouped = {};
    let skippedInvalid = 0;
    let expandedSets = 0;
    effRows.forEach(r => {
      const orderIdRaw = String(r[oh]||'').trim();
      const codeRaw = String(r[ch]||'').trim();
      // guard against stray sub-header / description rows or blank rows slipping through
      if(!orderIdRaw || !codeRaw){ skippedInvalid++; return; }
      const orderId = orderIdRaw;
      const code = codeRaw;
      if(!grouped[orderId]) grouped[orderId] = { orderId, customer: custH ? String(r[custH]||'').trim() : '', tracking: trackH ? String(r[trackH]||'').trim() : '', items: [] };
      const name = String(r[nh]||'').trim();
      let qty = parseInt(r[qh]);
      if(isNaN(qty) || qty<=0) qty = 1;

      const setDef = setDefs.byCode[code] || setDefs.byName[normName(name)];
      // a set definition whose ONLY component points back at its own code is not a real
      // bundle — it's the auto-generated "self-referencing" stub created purely so a
      // standalone product's name/photo can be looked up (see importSetsFromFile). Treating
      // it as a real bundle here would silently swallow the row into a duplicate of itself.
      const isRealBundle = setDef && setDef.components && setDef.components.length &&
        !(setDef.components.length === 1 && setDef.components[0].code === code);
      if(isRealBundle){
        expandedSets++;
        setDef.components.forEach(comp => {
          const compQty = (comp.qty||1) * qty;
          const existing = grouped[orderId].items.find(it => it.code === comp.code);
          if(existing){ existing.qtyRequired += compQty; }
          else { grouped[orderId].items.push({ code: comp.code, name: comp.name || comp.code, qtyRequired: compQty, qtyScanned: 0 }); }
        });
      } else {
        const existing = grouped[orderId].items.find(it => it.code === code);
        if(existing){ existing.qtyRequired += qty; }
        else { grouped[orderId].items.push({ code, name, qtyRequired: qty, qtyScanned: 0 }); }
      }
    });

    const orderIds = Object.keys(grouped);
    if(orderIds.length===0){ toast('ไม่พบออเดอร์ที่ถูกต้อง ตรวจสอบการจับคู่คอลัมน์ หรือค่า "ข้ามแถวแรก"'); btn.disabled=false; btn.textContent='นำเข้าข้อมูล'; return; }

    // fetch whatever's already saved for these order IDs BEFORE any deletion/overwrite,
    // so re-importing a file (e.g. to fix a data issue) never wipes out packing progress
    // that staff already scanned in
    btn.textContent = 'กำลังตรวจสอบข้อมูลเดิม...';
    const existingByOrderId = {};
    await mapWithConcurrency(orderIds, 6, async orderId => {
      const raw = await sGetWithRetry(orderKey(date, orderId), true);
      if(raw){ try{ existingByOrderId[orderId] = JSON.parse(raw); }catch(e){} }
    });

    // TikTok sometimes combines several Order IDs into ONE physical shipment/tracking
    // number (same package, different orders) — if we kept them as separate order
    // documents, scanning the shipping label would only ever open one of them and the
    // items belonging to the other order(s) would silently never show up to be packed.
    // Merge any orders that share a tracking number into a single combined order here,
    // carrying forward each original order's already-scanned progress if any.
    const byTracking = {};
    Object.values(grouped).forEach(o => {
      if(!o.tracking) return;
      const key = o.tracking;
      if(!byTracking[key]) byTracking[key] = [];
      byTracking[key].push(o);
    });
    let mergedGroupCount = 0;
    Object.values(byTracking).forEach(group => {
      if(group.length < 2) return;
      mergedGroupCount++;
      const originalOrderIds = group.map(o => o.orderId).sort();
      const mergedOrderId = originalOrderIds.join(' + ');
      const mergedItems = [];
      group.forEach(o => {
        o.items.forEach(it => {
          const existing = mergedItems.find(m => m.code === it.code);
          if(existing){ existing.qtyRequired += it.qtyRequired; }
          else { mergedItems.push({ code: it.code, name: it.name, qtyRequired: it.qtyRequired, qtyScanned: 0 }); }
        });
      });
      const mergedPrev = { items: [], packedBy: null, activityLog: [] };
      group.forEach(o => {
        const prev = existingByOrderId[o.orderId];
        if(prev && Array.isArray(prev.items)){
          prev.items.forEach(pi => {
            const ex = mergedPrev.items.find(m => m.code === pi.code);
            if(ex){ ex.qtyScanned += (pi.qtyScanned||0); }
            else { mergedPrev.items.push({ code: pi.code, qtyScanned: pi.qtyScanned||0 }); }
          });
          if(prev.packedBy) mergedPrev.packedBy = prev.packedBy;
          if(Array.isArray(prev.activityLog)) mergedPrev.activityLog = mergedPrev.activityLog.concat(prev.activityLog);
        }
        delete grouped[o.orderId];
        delete existingByOrderId[o.orderId];
      });
      if(mergedPrev.activityLog.length > 300) mergedPrev.activityLog = mergedPrev.activityLog.slice(-300);
      grouped[mergedOrderId] = {
        orderId: mergedOrderId,
        customer: group.map(o => o.customer).find(Boolean) || '',
        tracking: group[0].tracking,
        originalOrderIds,
        items: mergedItems
      };
      existingByOrderId[mergedOrderId] = mergedPrev;
    });
    const finalOrderIds = Object.keys(grouped);
    let restoredCount = 0;

    if(mergeMode==='replace'){
      const existingKeys = await sList('order:'+date+':', true);
      for(const k of existingKeys){
        await sDelete(k);
        await sleep(120);
      }
    } else if(mergedGroupCount){
      // even outside "replace" mode, explicitly remove any stale individual order docs
      // that a merge just superseded — otherwise both the old separate entries and the
      // new combined one would show up side by side in the order list
      for(const group of Object.values(byTracking)){
        if(group.length < 2) continue;
        for(const o of group){
          await sDelete(orderKey(date, o.orderId));
          await sleep(80);
        }
      }
    }

    let doneCount = 0;
    for(const orderId of finalOrderIds){
      const order = grouped[orderId];
      const prev = existingByOrderId[orderId];
      if(prev && Array.isArray(prev.items)){
        let anyRestored = false;
        order.items.forEach(it => {
          const prevItem = prev.items.find(p => p.code === it.code);
          if(prevItem && prevItem.qtyScanned){
            it.qtyScanned = Math.min(prevItem.qtyScanned, it.qtyRequired);
            anyRestored = true;
          }
        });
        if(prev.packedBy) order.packedBy = prev.packedBy;
        if(Array.isArray(prev.activityLog)) order.activityLog = prev.activityLog;
        if(anyRestored) restoredCount++;
      }
      order.status = 'pending';
      order.updatedAt = Date.now();
      await sSetWithRetry(orderKey(date, orderId), JSON.stringify(order), true);
      doneCount++;
      btn.textContent = 'กำลังนำเข้า... ('+doneCount+'/'+finalOrderIds.length+')';
      await sleep(150);
    }
    await addDateToIndex(date);

    toast('นำเข้าสำเร็จ '+finalOrderIds.length+' ออเดอร์'
      + (mergedGroupCount ? ' (รวมออเดอร์ที่ใช้เลขพัสดุเดียวกันให้ '+mergedGroupCount+' พัสดุ)' : '')
      + (restoredCount ? ' (คืนสถานะแพ็คเดิมให้ '+restoredCount+' ออเดอร์)' : '')
      + (expandedSets ? ' (แตกเซทให้ '+expandedSets+' รายการ)' : '')
      + (skippedInvalid ? ' (ข้าม '+skippedInvalid+' แถวที่ข้อมูลไม่ครบ)' : ''));
    State.uploadParsed = null;
    State.date = date;
    setTab('staff');
  };
}

function renderPrint(){
  const filtered = State.printCodes.filter(it => {
    if(!State.printSearch) return true;
    const s = State.printSearch.toLowerCase();
    return it.code.toLowerCase().includes(s) || (it.name||'').toLowerCase().includes(s);
  });

  if(State.printCodes.length===0){
    return `<div class="empty"><div class="big">🏷️</div>ยังไม่มีรหัสสินค้าให้พิมพ์บาร์โค้ด<br><span class="muted" style="font-size:13px">อัปโหลดออเดอร์อย่างน้อย 1 ครั้งก่อน ระบบจะดึงรหัสสินค้าจากออเดอร์มาให้เลือกพิมพ์</span></div>`;
  }

  const rows = filtered.map(it => {
    const photo = State.photoCache[it.code];
    const thumbHtml = photo
      ? `<img class="thumb" src="${photo}" data-thumb-for="${esc(it.code)}">`
      : `<div class="thumb-placeholder" data-thumb-for="${esc(it.code)}">🏷️</div>`;
    return `
    <div class="code-pick-row">
      <input type="checkbox" class="print-check" data-code="${esc(it.code)}">
      ${thumbHtml}
      <div class="cinfo">
        <div class="cname">${esc(it.name||'(ไม่มีชื่อสินค้า)')}</div>
        <div class="ccode">${esc(it.code)}</div>
      </div>
      <input type="number" class="cqty" min="1" max="200" value="${State.printQty[it.code]||1}" data-code-qty="${esc(it.code)}">
      <button type="button" class="photo-btn" data-photo-btn="${esc(it.code)}">📷 รูป</button>
      <input type="file" accept="image/*" capture="environment" style="display:none" data-photo-input="${esc(it.code)}">
    </div>
  `;
  }).join('');

  const pendingHtml = State.pendingPhotos.length ? `
    <div class="card" style="border-color:var(--warn)">
      <div style="font-weight:700;margin-bottom:6px">⚠ รูปที่ยังจับคู่สินค้าไม่ได้ (${State.pendingPhotos.length})</div>
      <div class="muted" style="font-size:12px;margin-bottom:10px">ไม่พบรหัสสินค้าที่ตรงกับชื่อไฟล์เหล่านี้ เลือกสินค้าที่ตรงกับแต่ละรูปเอง</div>
      ${State.pendingPhotos.map(p => `
        <div class="code-pick-row">
          <img class="thumb" src="${p.dataUrl}">
          <div class="cinfo"><div class="cname">${esc(p.fileName)}</div></div>
          <select data-assign-select="${p.id}" style="margin-bottom:0;flex:1">
            <option value="">— เลือกสินค้า —</option>
            ${State.printCodes.map(c => `<option value="${esc(c.code)}">${esc(c.name||c.code)} (${esc(c.code)})</option>`).join('')}
          </select>
          <button type="button" class="photo-btn" data-assign-save="${p.id}">บันทึก</button>
          <button type="button" class="photo-btn" style="color:var(--danger)" data-assign-skip="${p.id}">ข้าม</button>
        </div>
      `).join('')}
    </div>
  ` : '';

  return `
    <h2 class="section">พิมพ์สติกเกอร์บาร์โค้ดสินค้า</h2>
    <div class="card muted" style="font-size:13px;line-height:1.6">
      เลือกสินค้าที่ต้องการพิมพ์บาร์โค้ด (ใช้รหัส Seller SKU เดิมเป็นบาร์โค้ด) ใส่จำนวนดวงที่ต้องการต่อสินค้าหนึ่งชนิด แล้วกดพิมพ์ — นำกระดาษสติกเกอร์ใส่เครื่องพิมพ์ก่อนกด Print
    </div>
    <div class="row">
      <button class="btn secondary" id="bulk-photo-btn">📷 อัปโหลดรูปหลายไฟล์พร้อมกัน</button>
    </div>
    <div class="muted" style="font-size:12px;margin:-6px 0 12px">เคล็ดลับ: ตั้งชื่อไฟล์รูปตรงกับรหัสสินค้า (เช่น P0005.jpg) ระบบจะจับคู่ให้อัตโนมัติ</div>
    <input type="file" id="bulk-photo-input" accept="image/*" multiple style="display:none">
    ${pendingHtml}
    <input type="text" id="print-search" placeholder="ค้นหารหัสหรือชื่อสินค้า..." value="${esc(State.printSearch)}">
    <div class="row" style="margin-bottom:10px">
      <button class="btn secondary" id="select-all">เลือกทั้งหมด</button>
      <button class="btn secondary" id="select-none">ยกเลิกทั้งหมด</button>
    </div>
    <div id="code-list">${rows}</div>
    <div class="scan-bar" style="margin-top:14px">
      <button class="btn" id="do-print">🖨️ พิมพ์สติกเกอร์ที่เลือก</button>
    </div>
  `;
}

function wirePrint(){
  const search = document.getElementById('print-search');
  if(search){
    search.oninput = (e) => {
      const caret = e.target.selectionStart;
      State.printSearch = e.target.value;
      document.getElementById('main').innerHTML = renderPrint();
      wirePrint();
      const s2 = document.getElementById('print-search');
      if(s2){ s2.focus(); s2.setSelectionRange(caret, caret); }
    };
  }
  document.querySelectorAll('[data-code-qty]').forEach(inp => {
    inp.onchange = () => {
      let v = parseInt(inp.value);
      if(isNaN(v) || v<1) v = 1;
      State.printQty[inp.getAttribute('data-code-qty')] = v;
      inp.value = v;
    };
  });
  const selectAll = document.getElementById('select-all');
  if(selectAll) selectAll.onclick = () => document.querySelectorAll('.print-check').forEach(c => c.checked = true);
  const selectNone = document.getElementById('select-none');
  if(selectNone) selectNone.onclick = () => document.querySelectorAll('.print-check').forEach(c => c.checked = false);

  const bulkBtn = document.getElementById('bulk-photo-btn');
  const bulkInput = document.getElementById('bulk-photo-input');
  if(bulkBtn && bulkInput){
    bulkBtn.onclick = () => bulkInput.click();
    bulkInput.onchange = async (e) => {
      const files = Array.from(e.target.files || []);
      if(files.length===0) return;
      bulkBtn.disabled = true;
      let matched = 0;
      for(const file of files){
        bulkBtn.textContent = 'กำลังประมวลผล... ('+(matched+State.pendingPhotos.length+1)+'/'+files.length+')';
        const baseName = file.name.replace(/\.[^/.]+$/, '').trim();
        let dataUrl;
        try{ dataUrl = await resizeImageFile(file, 240, 0.72); }
        catch(err){ continue; }
        const codeMatch = State.printCodes.find(c => c.code.toLowerCase() === baseName.toLowerCase());
        if(codeMatch){
          await sSetWithRetry(photoKey(codeMatch.code), dataUrl, true);
          State.photoCache[codeMatch.code] = dataUrl;
          matched++;
        } else {
          State.pendingPhotos.push({ id: 'p'+Date.now()+Math.random().toString(36).slice(2), dataUrl, fileName: file.name });
        }
      }
      bulkBtn.disabled = false;
      bulkBtn.textContent = '📷 อัปโหลดรูปหลายไฟล์พร้อมกัน';
      bulkInput.value = '';
      toast('จับคู่อัตโนมัติสำเร็จ '+matched+' รูป' + (State.pendingPhotos.length ? ' เหลือ '+State.pendingPhotos.length+' รูปให้เลือกเอง' : ''));
      document.getElementById('main').innerHTML = renderPrint();
      wirePrint();
    };
  }

  document.querySelectorAll('[data-assign-select]').forEach(sel => {
    sel.onchange = () => {}; // value read on save click
  });
  document.querySelectorAll('[data-assign-save]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-assign-save');
      const sel = document.querySelector('[data-assign-select="'+id+'"]');
      const code = sel ? sel.value : '';
      if(!code){ toast('กรุณาเลือกสินค้าก่อนบันทึก'); return; }
      const p = State.pendingPhotos.find(x => x.id===id);
      if(!p) return;
      btn.disabled = true; btn.textContent = '...';
      await sSetWithRetry(photoKey(code), p.dataUrl, true);
      State.photoCache[code] = p.dataUrl;
      State.pendingPhotos = State.pendingPhotos.filter(x => x.id!==id);
      toast('บันทึกรูปแล้ว');
      document.getElementById('main').innerHTML = renderPrint();
      wirePrint();
    };
  });
  document.querySelectorAll('[data-assign-skip]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-assign-skip');
      State.pendingPhotos = State.pendingPhotos.filter(x => x.id!==id);
      document.getElementById('main').innerHTML = renderPrint();
      wirePrint();
    };
  });

  document.querySelectorAll('[data-photo-btn]').forEach(btn => {
    btn.onclick = () => {
      const code = btn.getAttribute('data-photo-btn');
      const input = document.querySelector('[data-photo-input="'+CSS.escape(code)+'"]');
      if(input) input.click();
    };
  });
  document.querySelectorAll('[data-photo-input]').forEach(inp => {
    inp.onchange = async (e) => {
      const code = inp.getAttribute('data-photo-input');
      const file = e.target.files[0];
      if(!file) return;
      const btn = document.querySelector('[data-photo-btn="'+CSS.escape(code)+'"]');
      if(btn){ btn.textContent = '...'; btn.disabled = true; }
      try{
        const dataUrl = await resizeImageFile(file, 240, 0.72);
        await sSetWithRetry(photoKey(code), dataUrl, true);
        State.photoCache[code] = dataUrl;
        const thumb = document.querySelector('[data-thumb-for="'+CSS.escape(code)+'"]');
        if(thumb){
          const img = document.createElement('img');
          img.className = 'thumb';
          img.setAttribute('data-thumb-for', code);
          img.src = dataUrl;
          thumb.replaceWith(img);
        }
        toast('บันทึกรูปแล้ว');
      }catch(err){
        toast('อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง');
      }
      if(btn){ btn.textContent = '📷 รูป'; btn.disabled = false; }
    };
  });

  document.getElementById('do-print').onclick = () => {
    const checked = Array.from(document.querySelectorAll('.print-check:checked')).map(c => c.getAttribute('data-code'));
    if(checked.length===0){ toast('กรุณาเลือกสินค้าที่ต้องการพิมพ์อย่างน้อย 1 รายการ'); return; }
    if(typeof JsBarcode === 'undefined'){ toast('โหลดตัวสร้างบาร์โค้ดไม่สำเร็จ ลองรีเฟรชหน้าใหม่'); return; }

    const sheet = document.getElementById('label-sheet');
    sheet.innerHTML = '';
    checked.forEach(code => {
      const item = State.printCodes.find(c => c.code === code);
      const qty = State.printQty[code] || 1;
      for(let i=0;i<qty;i++){
        const label = document.createElement('div');
        label.className = 'label';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'lname';
        nameDiv.textContent = item.name || '';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        label.appendChild(nameDiv);
        label.appendChild(svg);
        const codeDiv = document.createElement('div');
        codeDiv.className = 'lcode';
        codeDiv.textContent = code;
        label.appendChild(codeDiv);
        sheet.appendChild(label);
        try{
          JsBarcode(svg, code, { format: 'CODE128', width: 1.6, height: 40, displayValue: false, margin: 2 });
        }catch(e){ console.error('barcode render failed', code, e); }
      }
    });
    setTimeout(() => window.print(), 150);
  };
}

function downloadSetTemplate(){
  const wsData = [
    SET_TEMPLATE_HEADERS,
    ['SET001', '', 'P0005', 'โทนเนอร์กุหลาบ', 1],
    ['SET001', '', 'P0008', 'เบบี้ไบรท์เซรั่ม', 2],
    ['', 'เซทของขวัญปีใหม่ (ไม่มี SKU)', 'P0001', 'สบู่ข้าวออร์แกนิก', 3],
    ['', 'เซทของขวัญปีใหม่ (ไม่มี SKU)', 'P0027', 'แชมพูออร์แกนิกอัญชัน', 1]
  ];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'เซทสินค้า');
  XLSX.writeFile(wb, 'เทมเพลตเซทสินค้า.xlsx');
}

function wireSets(){
  if(!State.setForm){
    const newBtn = document.getElementById('new-set-btn');
    if(newBtn) newBtn.onclick = () => {
      State.setForm = { matchBy:'code', matchValue:'', name: '', components:[{code:'',name:'',qty:1}], editing:false, origKey:null };
      document.getElementById('main').innerHTML = renderSets();
      wireSets();
    };
    document.querySelectorAll('[data-edit-set]').forEach(btn => {
      btn.onclick = () => {
        const [matchBy, matchValue] = btn.getAttribute('data-edit-set').split('|');
        const def = State.setList.find(d => d.matchBy===matchBy && d.matchValue===matchValue);
        if(!def) return;
        State.setForm = { matchBy: def.matchBy, matchValue: def.matchValue, name: def.name||'', components: (def.components||[]).map(c=>({...c})), editing: true, origKey: setKey(def.matchBy, def.matchValue) };
        document.getElementById('main').innerHTML = renderSets();
        wireSets();
      };
    });
    document.querySelectorAll('[data-del-set]').forEach(btn => {
      btn.onclick = async () => {
        const [matchBy, matchValue] = btn.getAttribute('data-del-set').split('|');
        if(!confirm('ลบเซท "'+matchValue+'" ใช่หรือไม่?')) return;
        await sDelete(setKey(matchBy, matchValue));
        await refreshSets();
        document.getElementById('main').innerHTML = renderSets();
        wireSets();
      };
    });

    const dlBtn = document.getElementById('dl-set-template');
    if(dlBtn) dlBtn.onclick = downloadSetTemplate;

    const upBtn = document.getElementById('upload-set-file-btn');
    const upInput = document.getElementById('upload-set-file');
    if(upBtn && upInput){
      upBtn.onclick = () => upInput.click();
      upInput.onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        upBtn.disabled = true; upBtn.textContent = 'กำลังนำเข้า...';
        try{
          await importSetsFromFile(file);
        }catch(err){
          console.error(err);
          toast('อ่านไฟล์ไม่สำเร็จ กรุณาใช้เทมเพลตที่ดาวน์โหลดไว้');
        }
        upBtn.disabled = false; upBtn.textContent = '⬆ อัปโหลดไฟล์ที่กรอกแล้ว';
        upInput.value = '';
        await refreshSets();
        document.getElementById('main').innerHTML = renderSets();
        wireSets();
      };
    }
    return;
  }

  // form mode
  const matchBySelect = document.getElementById('set-matchby');
  if(matchBySelect){
    matchBySelect.onchange = () => {
      State.setForm.matchBy = matchBySelect.value;
      document.getElementById('main').innerHTML = renderSets();
      wireSets();
    };
  }
  const valInput = document.getElementById('set-value');
  if(valInput){ valInput.oninput = () => { State.setForm.matchValue = valInput.value.trim(); }; }

  function updateCompSummary(){
    const el = document.getElementById('comp-summary');
    if(!el || !State.setForm) return;
    const totalQtyAll = State.setForm.components.reduce((s,c) => s + (c.qty||0), 0);
    const totalTypes = State.setForm.components.filter(c => c.code.trim()).length;
    el.textContent = 'สินค้าย่อยที่ต้องหยิบ (ต่อ 1 เซท) — ใส่รูปแนบแต่ละ ID ได้เลย — รวม '+totalQtyAll+' ชิ้น จาก '+totalTypes+' รายการ (ID)';
  }

  document.querySelectorAll('[data-comp-code]').forEach(inp => {
    inp.oninput = () => {
      const idx = parseInt(inp.getAttribute('data-comp-code'));
      const val = inp.value.trim();
      State.setForm.components[idx].code = val;
      // auto-fill the name field if this code is already known and the name is still empty
      const nameInp = document.querySelector('[data-comp-name="'+idx+'"]');
      if(nameInp && !nameInp.value.trim()){
        const known = State.printCodes.find(p => p.code === val);
        if(known && known.name){
          nameInp.value = known.name;
          State.setForm.components[idx].name = known.name;
        }
      }
      updateCompSummary();
    };
    inp.onblur = async () => {
      const idx = parseInt(inp.getAttribute('data-comp-code'));
      const code = State.setForm.components[idx].code;
      const thumbEl = document.querySelector('[data-comp-thumb="'+idx+'"]');
      if(!thumbEl || !code) return;
      const photo = await getPhotoForCode(code);
      if(photo){
        const img = document.createElement('img');
        img.className = 'thumb-sm';
        img.setAttribute('data-comp-thumb', idx);
        img.src = photo;
        thumbEl.replaceWith(img);
      }
    };
  });
  document.querySelectorAll('[data-comp-name]').forEach(inp => {
    inp.oninput = () => { State.setForm.components[parseInt(inp.getAttribute('data-comp-name'))].name = inp.value.trim(); };
  });
  document.querySelectorAll('[data-comp-qty]').forEach(inp => {
    inp.oninput = () => {
      let v = parseInt(inp.value); if(isNaN(v)||v<1) v=1;
      State.setForm.components[parseInt(inp.getAttribute('data-comp-qty'))].qty = v;
      updateCompSummary();
    };
  });
  document.querySelectorAll('[data-comp-photo-btn]').forEach(btn => {
    btn.onclick = () => {
      const idx = btn.getAttribute('data-comp-photo-btn');
      const input = document.querySelector('[data-comp-photo-input="'+idx+'"]');
      if(input) input.click();
    };
  });
  document.querySelectorAll('[data-comp-photo-input]').forEach(inp => {
    inp.onchange = async (e) => {
      const idx = parseInt(inp.getAttribute('data-comp-photo-input'));
      const code = (State.setForm.components[idx].code||'').trim();
      const file = e.target.files[0];
      if(!file) return;
      if(!code){ toast('กรุณาใส่รหัสสินค้าย่อย (ID) ก่อนแนบรูป'); inp.value=''; return; }
      const btn = document.querySelector('[data-comp-photo-btn="'+idx+'"]');
      if(btn){ btn.textContent='...'; btn.disabled = true; }
      try{
        const dataUrl = await resizeImageFile(file, 240, 0.72);
        await sSetWithRetry(photoKey(code), dataUrl, true);
        State.photoCache[code] = dataUrl;
        const thumbEl = document.querySelector('[data-comp-thumb="'+idx+'"]');
        if(thumbEl){
          const img = document.createElement('img');
          img.className = 'thumb-sm';
          img.setAttribute('data-comp-thumb', idx);
          img.src = dataUrl;
          thumbEl.replaceWith(img);
        }
        toast('แนบรูปสินค้า '+code+' แล้ว');
      }catch(err){
        toast('อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง');
      }
      if(btn){ btn.textContent='📷'; btn.disabled=false; }
      inp.value='';
    };
  });
  document.querySelectorAll('[data-comp-remove]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.getAttribute('data-comp-remove'));
      if(State.setForm.components.length<=1){ toast('ต้องมีสินค้าย่อยอย่างน้อย 1 รายการ'); return; }
      State.setForm.components.splice(idx,1);
      document.getElementById('main').innerHTML = renderSets();
      wireSets();
    };
  });
  document.getElementById('add-comp-btn').onclick = () => {
    State.setForm.components.push({code:'',name:'',qty:1});
    document.getElementById('main').innerHTML = renderSets();
    wireSets();
  };
  document.getElementById('cancel-set-btn').onclick = () => {
    State.setForm = null;
    document.getElementById('main').innerHTML = renderSets();
    wireSets();
  };
  document.getElementById('save-set-btn').onclick = async () => {
    const matchBy = document.getElementById('set-matchby').value;
    const matchValue = document.getElementById('set-value').value.trim();
    const name = document.getElementById('set-name').value.trim();
    if(!matchValue){ toast(matchBy==='name' ? 'กรุณาใส่ชื่อสินค้าเซท' : 'กรุณาใส่รหัส SKU ของเซท'); return; }
    const comps = State.setForm.components
      .map(c => ({ code: c.code.trim(), name: c.name.trim() || (State.printCodes.find(p=>p.code===c.code.trim())||{}).name || '', qty: c.qty||1 }))
      .filter(c => c.code);
    if(comps.length===0){ toast('กรุณาใส่สินค้าย่อยอย่างน้อย 1 รายการ'); return; }
    if(comps.some(c => !c.name)){ toast('กรุณาใส่ชื่อสินค้าให้ครบทุกรายการย่อย ไม่งั้นจะโชว์เป็นรหัสแทนชื่อตอนสแกน'); return; }
    const btn = document.getElementById('save-set-btn');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    const newKey = setKey(matchBy, matchValue);
    if(State.setForm.origKey && State.setForm.origKey !== newKey){
      await sDelete(State.setForm.origKey);
    }
    await sSetWithRetry(newKey, JSON.stringify({ matchBy, matchValue, name, components: comps }), true);
    State.setForm = null;
    await refreshSets();
    toast('บันทึกเซทแล้ว');
    document.getElementById('main').innerHTML = renderSets();
    wireSets();
  };
}

async function importSetsFromFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  fillMergedCells(sheet);
  // read as raw rows (not header-keyed) since the native TikTok product export re-uses
  // the same column header ("SKU") five times for each set-component slot — a header-keyed
  // parse would silently collide and drop all but the last one
  const rows2d = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  if(!rows2d.length){ toast('ไม่พบข้อมูลในไฟล์'); return; }
  const headerRow = rows2d[0].map(h => String(h||'').trim());
  const dataRows = rows2d.slice(1).filter(r => r.some(c => String(c||'').trim()!==''));

  // detect the native "Tiktok_Onlineproducts" export: one row per product/variant SKU, with
  // its own name/code/stock/price, plus up to 5 inline "component" slots for combo/set SKUs
  const isWideProductExport = headerRow.some(h => h.includes('ในเซทประกอบด้วย')) && headerRow.some(h => h.includes('Product ID'));

  let defs = [];
  let skipped = 0;

  if(isWideProductExport){
    // pass 1: build a code -> friendly name lookup from every row (name + variant option, if any)
    const nameByCode = {};
    dataRows.forEach(r => {
      const name = String(r[0]||'').trim();
      const option = String(r[2]||'').trim();
      const sku = String(r[3]||'').trim();
      if(!sku) return;
      nameByCode[sku] = option ? name+' ('+option+')' : name;
    });
    // pass 2: one set definition per row — real combos use their listed components; standalone
    // products get a 1-item self-referencing definition so their name/photo can still be registered
    dataRows.forEach(r => {
      const sku = String(r[3]||'').trim();
      if(!sku){ skipped++; return; }
      const ownName = nameByCode[sku] || sku;
      const comps = [];
      for(let slot=0; slot<5; slot++){
        const base = 6 + slot*3; // [componentProductId, componentSKU, qty]
        const compSku = String(r[base+1]||'').trim();
        if(!compSku) continue;
        let qty = parseInt(r[base+2]);
        if(isNaN(qty) || qty<=0) qty = 1;
        comps.push({ code: compSku, name: nameByCode[compSku] || compSku, qty });
      }
      if(comps.length===0) comps.push({ code: sku, name: ownName, qty: 1 });
      defs.push({ matchBy:'code', matchValue: sku, name: ownName, components: comps });
    });
  } else {
    const headers = headerRow;
    const json = dataRows.map(r => { const o={}; headers.forEach((h,i)=>o[h]=r[i]!==undefined?r[i]:''); return o; });
    const find = (kw) => headers.find(h => h.toLowerCase().includes(kw)) || null;
    const hCode = find('รหัสเซท') || headers[0];
    const hName = find('ชื่อสินค้าเซท') || headers[1];
    const hCompCode = find('รหัสสินค้าย่อย') || headers[2];
    const hCompName = find('ชื่อสินค้าย่อย') || headers[3];
    const hQty = find('จำนวน') || headers[4];

    const grouped = {}; // key -> {matchBy,matchValue,name,components}
    json.forEach(r => {
      const setCode = String(r[hCode]||'').trim();
      const setName = String(r[hName]||'').trim();
      const compCode = String(r[hCompCode]||'').trim();
      if(!compCode || (!setCode && !setName)){ skipped++; return; }
      const matchBy = setCode ? 'code' : 'name';
      const matchValue = setCode || setName;
      const key = matchBy+'|'+normName(matchValue);
      if(!grouped[key]) grouped[key] = { matchBy, matchValue, name: setName || setCode, components: [] };
      let qty = parseInt(r[hQty]);
      if(isNaN(qty) || qty<=0) qty = 1;
      const compName = String(r[hCompName]||'').trim();
      const existing = grouped[key].components.find(c => c.code === compCode);
      if(existing){ existing.qty += qty; }
      else { grouped[key].components.push({ code: compCode, name: compName, qty }); }
    });
    defs = Object.values(grouped);
  }

  if(defs.length===0){ toast('ไม่พบรายการเซทที่ถูกต้องในไฟล์ ตรวจสอบว่ากรอกตามเทมเพลต'); return; }

  let done = 0;
  for(const def of defs){
    await sSetWithRetry(setKey(def.matchBy, def.matchValue), JSON.stringify(def), true);
    done++;
    await sleep(150);
  }
  toast('นำเข้าสินค้าสำเร็จ '+done+' รายการ' + (skipped ? ' (ข้าม '+skipped+' แถวที่ข้อมูลไม่ครบ)' : ''));
}

(async function init(){
  const banner = document.getElementById('setup-banner');
  if(!backendReady){
    banner.className = 'setup-banner';
    banner.innerHTML = '<b>⚠ ยังไม่ได้ตั้งค่าฐานข้อมูล</b> — ข้อมูลออเดอร์จะยังไม่ถูกบันทึก กรุณาใส่ค่า Firebase config ในไฟล์นี้ก่อนใช้งานจริง (ดูวิธีจาก Claude)';
  }
  loadStaffName();
  if(!State.staffName) openStaffModal();
  await refreshStaffList();
  render();
})();
</script>
